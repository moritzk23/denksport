/* ---------------- Modul 6: N-Back ---------------- */
SCREENS.nback = function(){
  const L=startLevel('nback');
  const N   = L<=2 ? 1 : L<=6 ? 2 : 3;            // Level steuert die Gedächtnistiefe
  const ISI = Math.max(1600, 2800 - L*110);       // höheres Level = schnelleres Tempo
  const LEN = 14 + Math.min(10, L);               // höheres Level = mehr Durchgänge
  sessionShell('nback');
  document.getElementById('body').innerHTML=`
    <div class="card">
      <p style="font-size:16px; line-height:1.5; margin:0 0 8px;">Es erscheinen nacheinander Buchstaben. Tippe <b>„Treffer"</b>, wenn der aktuelle Buchstabe <b>derselbe ist wie ${N} ${N===1?'Schritt':'Schritte'} vorher</b> (${N}-Back).</p>
      <p class="muted" style="font-size:14px; margin:0;">Vergleiche jeden Buchstaben mit dem, der ${N} ${N===1?'Position':'Positionen'} vorher kam.</p>
    </div>
    <div class="spacer"></div>
    <div class="card note">
      <p style="margin:0; font-size:13px; line-height:1.5;">Zur Einordnung: N-Back verbessert belegbar N-Back und ähnliche Merkaufgaben. Dass davon die allgemeine Denkfähigkeit profitiert, ist in Übersichtsarbeiten <b>nicht</b> belegt. Nimm es als Konzentrationsübung, nicht als Intelligenztraining.</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="startnb">Los geht's (${N}-Back)</button>`;
  document.getElementById('startnb').onclick=run;

  function run(){
    const {seq, targets} = genNBack(N, LEN);
    const body=document.getElementById('body');
    const GAP = 380;                               // Leerpause: trennt zwei gleiche Buchstaben sichtbar
    const SHOW = Math.max(750, ISI - GAP);
    let i=0, pressed=false, hits=0, misses=0, fa=0;

    body.innerHTML = `<div class="nb-letter" id="nbl"></div><button class="nb-hit" id="hit">Treffer</button>`;
    const letterEl = document.getElementById('nbl');
    const hitBtn = document.getElementById('hit');
    hitBtn.onclick = function(){
      if(!pressed){ pressed=true; this.classList.add('flash'); Sound.beep(520,0.06,'sine',0,0.1); buzz(10); }
    };

    function step(){
      setHud(`${i+1}/${LEN} · ${N}-Back`);
      pressed=false; hitBtn.classList.remove('flash');
      letterEl.textContent = seq[i];
      letterEl.classList.remove('pop'); void letterEl.offsetWidth; letterEl.classList.add('pop');
      laterIfActive(()=>{
        letterEl.textContent='';                   // Buchstabe aus -> Pause
        laterIfActive(()=>{                        // Antwortfenster endet mit der Pause
          if(i>=N){ const t=(seq[i]===seq[i-N]); if(t){ pressed?hits++:misses++; } else if(pressed){ fa++; } }
          i++; if(i>=LEN) finish(); else step();
        }, GAP);
      }, SHOW);
    }
    function finish(){
      const sc=Math.max(0, hits*18 - fa*10 - misses*4);
      /* Quote über ALLE bewerteten Durchgänge, nicht nur über die Treffer: Sonst erreicht
         100 %, wer stur bei jedem Buchstaben tippt – Fehlalarme blieben unsichtbar. */
      const bewertet = LEN - N;
      const richtig  = hits + (bewertet - targets - fa);
      growByAccuracy('nback', L, richtig, bewertet);
      registerSession('nback', sc, {correct:richtig, total:bewertet, level:L});
      resultScreen('🎯 N-Back', hits, targets, sc, 0, 'nback', `${N}-Back · Fehlalarme: ${fa} · Verpasst: ${misses}`, levelInfo('nback', L));
    }
    step();
  }
};

/* ---------------- Flow-Modus (endloser Häppchen-Feed) ---------------- */
function floatXP(text, btn){
  const el=document.createElement('div'); el.className='floatxp'; el.textContent=text;
  document.body.appendChild(el);
  let x=window.innerWidth/2, y=window.innerHeight*0.4;
  if(btn){ const r=btn.getBoundingClientRect(); x=r.left+r.width/2; y=r.top; }
  el.style.left=x+'px'; el.style.top=y+'px';
  requestAnimationFrame(()=>el.classList.add('go'));
  setTimeout(()=>el.remove(),800);
}
SCREENS.flow = function(){
  const best = state.best.flow||0;
  app.innerHTML = `
    <h2 class="shead" style="margin-top:6px;"><span class="hicon">${svgIcon('flow',22)}</span>Flow</h2>
    <div class="card">
      <p style="font-size:16px; line-height:1.5; margin:0 0 8px;">Endlose, schnelle Aufgaben aus allen Bereichen. Jede richtige Antwort erhöht deine <b>Combo</b> und bringt mehr XP. Drei Fehler – dann ist der Lauf vorbei.</p>
      <p class="muted" style="font-size:14px; margin:0;">Bestlauf: ${best} Punkte</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="flowstart">Lauf starten</button>
    ${navBar('flow')}
  `;
  document.getElementById('flowstart').onclick=run;

  function run(){
    let lives=3, score=0, combo=0, bestCombo=0, count=0, right=0, answered=false, cur=null, curType=null;
    const startAll=Date.now();
    const body = () => document.getElementById('flowbody');

    app.innerHTML = `
      <div class="flowtop">
        <div class="flives" id="flives"></div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="fscore"><span id="fscore">0</span> Pkt</div>
          <button class="back" style="padding:7px 11px;" onclick="go('home')" aria-label="Beenden">✕</button>
        </div>
      </div>
      <div class="fcombo" id="fcombo"></div>
      <div id="flowbody"></div>`;
    updateTop(); next();

    function updateTop(){
      document.getElementById('flives').innerHTML =
        Array.from({length:3},(_,i)=>`<span class="heart ${i<lives?'on':'off'}">${svgIcon('heart',20)}</span>`).join('');
      document.getElementById('fscore').textContent = score;
      const cc=document.getElementById('fcombo');
      cc.textContent = combo>=2 ? `${combo}× Combo` : '';
      cc.className = 'fcombo' + (combo>=2?' show':'');
    }
    function lvlForCombo(){ return Math.max(1, Math.min(10, 1 + Math.floor(combo/3))); }
    function next(){
      answered=false;
      const L=lvlForCombo();
      curType = pick(['math','seq','logic','matrix']);
      if(curType==='math'){ cur=genMath(L); renderChoice(cur.q, cur.ans, distractors(cur.ans), cur.cls); }
      else if(curType==='seq'){ cur=genSeq(L); renderChoice(cur.arr.join('  ·  ')+'  ·  ?', cur.next, distractors(cur.next), 'small'); }
      else if(curType==='logic'){ cur=genLogic(L); renderLogic(cur); }
      else { cur=genMatrix(L); renderMatrix(cur); }
    }
    function renderChoice(promptText, ans, opts, cls){
      body().innerHTML = `
        <div class="prompt ${cls||''}">${promptText}</div>
        <div class="answers">${opts.map(o=>`<button class="ans" data-v="${o}">${o}</button>`).join('')}</div>
        <div class="feedback" id="fb"></div>`;
      document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>judge(+b.dataset.v===ans, b));
    }
    function renderLogic(c){
      body().innerHTML = `
        <p class="muted">Angenommen:</p>
        ${c.prem.map(p=>`<div class="premise">${p}</div>`).join('')}
        <div class="concl">${c.concl}</div>
        <div class="tf">
          <button class="t" data-v="1">WAHR</button>
          <button class="f" data-v="0">FALSCH</button>
        </div>
        <div class="feedback" id="fb"></div>`;
      document.querySelectorAll('.tf button').forEach(b=>b.onclick=()=>judge((b.dataset.v==='1')===c.truth, b));
    }
    function renderMatrix(c){
      body().innerHTML = `${matrixHtml(c)}<div class="feedback" id="fb"></div>`;
      document.querySelectorAll('.mopt').forEach(b=>b.onclick=()=>judge(matrixIsCorrect(c,b), b));
    }
    function markCorrect(){
      if(curType==='math'||curType==='seq') document.querySelectorAll('.ans').forEach(b=>{ if(+b.dataset.v===cur.ans || +b.dataset.v===cur.next) b.classList.add('correct'); });
      else if(curType==='matrix') matrixMarkAnswer(cur);
    }
    function judge(correct, btn){
      if(answered) return; answered=true; count++;
      if(correct){
        right++; combo++; bestCombo=Math.max(bestCombo,combo);
        const pts = 10 + combo*2;
        score += pts; fxCorrect(); floatXP('+'+pts, btn);
        if(btn) btn.classList.add('correct');
        if(combo%5===0){ Sound.levelup(); toast(`${combo}× Combo!`); }
        updateTop();
        laterIfActive(next, 340);
      }else{
        combo=0; lives--; fxWrong();
        if(btn) btn.classList.add('wrong');
        markCorrect(); updateTop();
        laterIfActive(()=> lives<=0 ? end() : next(), 780);
      }
    }
    function end(){
      const isBest = score>(state.best.flow||0);
      registerSession('flow', score, {correct:right, total:count, secs:Math.round((Date.now()-startAll)/1000)});
      const xpRes = gainXP(Math.round(score*0.8));
      app.innerHTML = `
        <div class="center" style="padding-top:26px;">
          <div class="ricon">${svgIcon('flow',48)}</div>
          <h2>${isBest?'Neuer Bestlauf!':'Lauf beendet'}</h2>
          <div class="card" style="margin:16px 0;">
            <div class="big-num">${score}</div>
            <div class="muted">Punkte</div>
            <div class="xpgain">+${xpRes.gained} XP</div>
            <div class="spacer"></div>
            <div class="row">
              <div class="stat"><div class="big">${count}</div><div class="lbl">Fragen</div></div>
              <div class="stat"><div class="big">${bestCombo}×</div><div class="lbl">Beste Combo</div></div>
              <div class="stat"><div class="big">${state.best.flow||score}</div><div class="lbl">Bestlauf</div></div>
            </div>
          </div>
          <button class="btn" onclick="go('flow')">Nochmal</button>
          <div class="spacer"></div>
          <button class="btn ghost" onclick="go('home')">Zur Startseite</button>
        </div>`;
      if(isBest || xpRes.leveledUp) confetti();
      if(xpRes.leveledUp){ Sound.levelup(); toast('Level '+xpRes.level+' erreicht!'); }
    }
  }
};

/* ---------------- Prüfungssimulation: Bildschirme ---------------- */
SCREENS.pruefung = function(){
  const laeufe = (state.exams||[]).slice(-4).reverse();
  app.innerHTML = `
    <div class="topbar"><button class="back" onclick="go('home')">‹ Zurück</button></div>
    <h2 class="shead"><span class="hicon">${svgIcon('exam',22)}</span>Prüfungssimulation</h2>
    <div class="card">
      <p style="font-size:15px; line-height:1.5; margin:0 0 8px;">Nachbildung eines Auswahlverfahrens: <b>Gesamtzeit statt Zeit je Aufgabe</b>, keine Rückmeldung zwischendurch. Erst am Ende siehst du, wo du stehst.</p>
      <p class="muted" style="font-size:13px; margin:0;">Die Schwierigkeit ist fest eingestellt, damit zwei Läufe im Abstand von Wochen vergleichbar bleiben. Das Ergebnis verändert deine Trainings-Level deshalb nicht.</p>
    </div>
    <div class="spacer"></div>
    ${Object.entries(PRUEF_FORMATE).map(([k,f],i)=>
      `<button class="btn ${i?'ghost':''}" data-f="${k}">${f.name} · ${f.text}</button><div class="spacer"></div>`).join('')}
    ${laeufe.length?`
      <div class="card">
        <div style="font-weight:700; margin-bottom:8px;">Bisherige Läufe</div>
        ${laeufe.map(l=>`<div style="display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px solid var(--line);">
            <span class="muted">${l.day} · ${PRUEF_FORMATE[l.format]?PRUEF_FORMATE[l.format].name:l.format}</span>
            <span><b>${Math.round(l.correct/l.total*100)} %</b> <span class="muted">(${l.correct}/${l.total})</span></span>
          </div>`).join('')}
      </div>`:''}
    ${navBar('home')}`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>lauf(b.dataset.f));

  function lauf(formatKey){
    const f = PRUEF_FORMATE[formatKey];
    const items = pruefungsAufgaben(f.n);
    let i=0, richtig=0, rest=f.sek, beendet=false;
    const proTyp = {};                       // Aufgabenart -> {richtig, gesamt}
    const start = Date.now();

    app.innerHTML = `
      <div class="ptop">
        <div class="pzeit" id="pzeit">${mmss(rest)}</div>
        <div class="muted" id="pfort"></div>
        <button class="back" style="padding:7px 11px;" id="pstop" aria-label="Abbrechen">✕</button>
      </div>
      <div class="tzeit"><i id="pbar" style="width:100%"></i></div>
      <div id="pbody"></div>`;
    document.getElementById('pstop').onclick = ()=>go('pruefung');
    zeige(); ticke();

    function ticke(){
      if(beendet) return;
      rest--;
      const z=document.getElementById('pzeit'); if(!z) return;
      z.textContent = mmss(rest);
      z.classList.toggle('knapp', rest<=30);
      document.getElementById('pbar').style.width = (rest/f.sek*100)+'%';
      if(rest<=0) return fertig();
      laterIfActive(ticke, 1000);
    }
    function zeige(){
      const it = items[i];
      document.getElementById('pfort').textContent = `${i+1} von ${f.n}`;
      document.getElementById('pbody').innerHTML =
        (it.typ==='table' ? tabelleHtml(it.g)
                          : `<div class="prompt ${it.g.cls||''}">${it.g.q}</div>
                             ${it.g.einheit?`<div class="einheit">Antwort in ${it.g.einheit}</div>`:''}`)
        + `<div class="answers">${it.opts.map(o=>`<button class="ans" data-v="${o}">${num(o)}</button>`).join('')}</div>`;
      document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>antwort(+b.dataset.v));
    }
    function antwort(v){
      const it = items[i];
      const ok = Math.abs(v - it.ans) < 1e-9;
      const p = proTyp[it.kind] = proTyp[it.kind] || {richtig:0, gesamt:0};
      p.gesamt++; if(ok){ p.richtig++; richtig++; }
      i++;
      if(i>=f.n) return fertig();
      zeige();                                   // ohne Rückmeldung direkt weiter
    }
    function fertig(){
      if(beendet) return; beendet=true;
      const secs = Math.min(f.sek, Math.round((Date.now()-start)/1000));
      const eintrag = {day:todayStr(), format:formatKey, correct:richtig, total:f.n,
                       bearbeitet:i, secs, proTyp};
      state.exams = (state.exams||[]).concat([eintrag]);
      if(state.exams.length>30) state.exams.shift();
      /* Bewusst kein growByAccuracy: Die Prüfung misst, sie trainiert nicht.
         registerSession zählt sie aber als Übungseinheit für Streak und XP. */
      registerSession('pruefung', richtig*15, {correct:richtig, total:f.n, secs, level:PRUEF_LEVEL});
      auswertung(eintrag);
    }
  }
};

function auswertung(e){
  const quote = Math.round(e.correct/e.total*100);
  const vorher = (state.exams||[]).filter(x=>x!==e && x.format===e.format).slice(-1)[0];
  const delta = vorher ? quote - Math.round(vorher.correct/vorher.total*100) : null;
  const zeilen = Object.entries(e.proTyp)
    .map(([k,v])=>({name:AUFGABEN_NAMEN[k]||k, ...v, q:v.richtig/v.gesamt}))
    .sort((a,b)=>a.q-b.q);                       // schwächste Art zuerst
  app.innerHTML = `
    <div class="center" style="padding-top:20px;">
      <div class="ricon">${svgIcon('exam',48)}</div>
      <h2>Prüfung ausgewertet</h2>
      <div class="card" style="margin:16px 0;">
        <div class="big-num">${quote} %</div>
        <div class="muted">richtig (${e.correct} von ${e.total})</div>
        ${delta!==null?`<div class="lvlchange ${delta>0?'up':delta<0?'down':'same'}">
          ${delta>0?'+':''}${delta} Prozentpunkte gegenüber dem letzten Lauf</div>`:''}
        <div class="spacer"></div>
        <div class="row">
          <div class="stat"><div class="big">${e.bearbeitet}</div><div class="lbl">bearbeitet</div></div>
          <div class="stat"><div class="big">${mmss(e.secs)}</div><div class="lbl">gebraucht</div></div>
          <div class="stat"><div class="big">${(e.secs/Math.max(1,e.bearbeitet)).toFixed(0)}s</div><div class="lbl">je Aufgabe</div></div>
        </div>
      </div>
      <div class="card" style="text-align:left;">
        <div style="font-weight:700; margin-bottom:8px;">Nach Aufgabenart</div>
        ${zeilen.map(z=>`
          <div style="margin-bottom:9px;">
            <div style="display:flex; justify-content:space-between; font-size:13px;">
              <span>${z.name}</span><span class="muted">${z.richtig}/${z.gesamt}</span>
            </div>
            <div class="bar" style="margin:4px 0 0;"><i style="width:${Math.round(z.q*100)}%"></i></div>
          </div>`).join('')}
        <p class="muted" style="font-size:12px; margin:10px 0 0;">Die schwächste Art steht oben – dort lohnt das Training am meisten.</p>
      </div>
      <div class="spacer"></div>
      <button class="btn" onclick="go('pruefung')">Noch ein Lauf</button>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="go('home')">Zur Startseite</button>
    </div>`;
}

/* ---------------- Ergebnis-Screen ---------------- */
function resultScreen(title, correct, total, score, secs, module, extra, lvl){
  const isNewBest = state.best[module]===score && score>0;
  const xpRes = gainXP(Math.round(score*0.6));
  const up = !!(lvl && lvl.to>lvl.from), down = !!(lvl && lvl.to<lvl.from);
  let lvlHtml='';
  if(lvl){
    lvlHtml = up
      ? `<div class="lvlchange up">Level ${lvl.from} → ${lvl.to} ⬆</div>`
      : down
        ? `<div class="lvlchange down">Level ${lvl.from} → ${lvl.to} ⬇</div>`
        : `<div class="lvlchange same">Level ${lvl.to} gehalten</div>`;
  }
  const heading = up ? 'Level aufgestiegen!' : isNewBest ? 'Neuer Bestwert!' : 'Session beendet';
  app.innerHTML = `
    <div class="center" style="padding-top:20px;">
      <div class="ricon">${svgIcon(MODULES[module].icon,48)}</div>
      <h2>${heading}</h2>
      <div class="card" style="margin:16px 0;">
        <div class="big-num">${score}</div>
        <div class="muted">Punkte</div>
        <div class="xpgain">+${xpRes.gained} XP</div>
        ${lvlHtml}
        <div class="spacer"></div>
        <div class="row">
          <div class="stat"><div class="big">${correct}/${total}</div><div class="lbl">${module==='nback'?'Treffer':module==='memory'?'Länge':'Richtig'}</div></div>
          ${secs?`<div class="stat"><div class="big">${secs}s</div><div class="lbl">Zeit</div></div>`:''}
          <div class="stat"><div class="big">${state.best[module]||score}</div><div class="lbl">Bestwert</div></div>
        </div>
        ${extra?`<div class="muted" style="margin-top:10px;">${extra}</div>`:''}
      </div>
      <button class="btn" onclick="go('${module}')">Nochmal</button>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="go('home')">Zur Startseite</button>
    </div>`;
  if(up || xpRes.leveledUp){ Sound.levelup(); confetti(); }
  else if(isNewBest){ confetti(); }
  if(xpRes.leveledUp) toast('Level '+xpRes.level+' erreicht!');
  else if(state.todayCount===state.goal) toast('Tagesziel erreicht');
}

/* ---------------- Statistik ---------------- */
SCREENS.stats = function(){
  /* Diagramm zeigt Trefferquote, nicht den Score: die Score-Formeln der Module sind
     untereinander nicht vergleichbar. Das Level steht unter jedem Balken, denn eine
     Quote ist nur bei gleichem Level aussagekräftig. */
  const acc = state.history.filter(h=>typeof h.acc==='number').slice(-14);
  const byModule = {};
  state.history.forEach(h=>{
    const m = byModule[h.module] = byModule[h.module] || {n:0, accSum:0, accN:0, secSum:0, secN:0, span:0};
    m.n++;
    if(typeof h.acc==='number'){ m.accSum+=h.acc; m.accN++; }
    if(typeof h.secs==='number'){ m.secSum+=h.secs; m.secN++; }
    if(typeof h.span==='number') m.span=Math.max(m.span, h.span);
  });
  app.innerHTML = `
    <h2 class="shead" style="margin-top:6px;"><span class="hicon">${svgIcon('stats',22)}</span>Statistik</h2>
    ${xpBar()}
    <div class="spacer"></div>
    <div class="card">
      <div class="muted" style="font-size:13px;">Trefferquote der letzten ${acc.length} Sessions</div>
      ${acc.length ? `
        <div class="chartrow">${acc.map(h=>
          `<div style="height:${Math.max(3,h.acc)}%" title="${h.acc}%${h.lvl?' auf Level '+h.lvl:''}"></div>`).join('')}</div>
        <div class="chartlbl">${acc.map(h=>`<span>${h.lvl||'·'}</span>`).join('')}</div>
        <div class="muted" style="font-size:11px; margin-top:6px;">Zahl unter dem Balken = Level. Eine Quote ist nur bei gleichem Level vergleichbar.</div>`
        : `<div class="chartrow"><div class="muted" style="align-self:center; background:none;">Noch keine Daten – leg los!</div></div>`}
    </div>
    <div class="spacer"></div>
    ${Object.entries(byModule).map(([k,v])=>{
      const sonder = {flow:['Flow','flow'], pruefung:['Prüfungssimulation','exam']};
      const name = MODULES[k] ? MODULES[k].name : (sonder[k] ? sonder[k][0] : k);
      const ic   = MODULES[k] ? MODULES[k].icon : (sonder[k] ? sonder[k][1] : 'stats');
      const bits = [v.n+(v.n===1?' Session':' Sessions')];
      if(v.accN) bits.push('⌀ '+Math.round(v.accSum/v.accN)+'% richtig');
      if(v.span) bits.push('max. '+v.span+' Ziffern');
      if(v.secN) bits.push('⌀ '+Math.round(v.secSum/v.secN)+'s');
      return `<div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <div style="display:flex; align-items:center; gap:10px; min-width:0;"><span class="hicon">${svgIcon(ic,20)}</span>
          <div style="min-width:0;"><div style="font-weight:700;">${name}</div>
          <div class="muted" style="font-size:12px;">${bits.join(' · ')}</div></div></div>
        <div style="text-align:right; flex:none;">
          <div style="font-size:20px; font-weight:800; color:var(--acc)">${state.best[k]||0}</div>
          <div class="muted" style="font-size:11px;">Bestwert</div>
        </div>
      </div>`;}).join('') || '<p class="muted">Noch keine Trainingsdaten vorhanden.</p>'}
    <div class="spacer"></div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:4px;">Daten sichern</div>
      <p class="muted" style="font-size:12px; margin:0 0 12px;">Der Fortschritt liegt nur auf diesem Gerät. Safari kann ihn löschen – exportiere ihn gelegentlich.</p>
      <div class="row">
        <button class="btn ghost" style="flex:1;" onclick="exportData()">Exportieren</button>
        <button class="btn ghost" style="flex:1;" onclick="document.getElementById('impf').click()">Importieren</button>
      </div>
      <input type="file" id="impf" accept="application/json,.json" style="display:none" onchange="importData(this)">
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="if(confirm('Wirklich alle Daten löschen? Das kann nicht rückgängig gemacht werden.')){localStorage.removeItem('denksport'); location.reload();}">Fortschritt zurücksetzen</button>
    ${navBar('stats')}
  `;
};

/* ---------------- Datensicherung ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'denksport-'+todayStr()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Datei wird gesichert');
}
function importData(input){
  const file = input.files && input.files[0];
  input.value = '';                                  // erneuter Import derselben Datei möglich
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try{ data = JSON.parse(rd.result); }
    catch(e){ alert('Das ist keine gültige Denksport-Datei.'); return; }
    if(!data || typeof data!=='object' || !('xp' in data) || !Array.isArray(data.history)){
      alert('Die Datei enthält keine Denksport-Daten.'); return;
    }
    const p = playerLevel(data.xp||0);
    if(!confirm(`Import überschreibt deinen aktuellen Fortschritt.\n\nDatei: Level ${p.level}, ${data.history.length} Sessions, Streak ${data.streak||0}.\n\nFortfahren?`)) return;
    DB.save(data);
    location.reload();
  };
  rd.onerror = () => alert('Datei konnte nicht gelesen werden.');
  rd.readAsText(file);
}

/* ---------------- Helfer ---------------- */
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* Der Abstand wächst mit der Wurzel des Ergebnisses, nicht proportional: Bei 551 lägen
   ±30 % so weit auseinander, dass Schätzen genügt – bei 8 wären ±30 % dagegen zu eng. */
function distractors(correct){
  const spread = Math.max(2, Math.round(Math.sqrt(Math.abs(correct))*1.5));
  const set=new Set([correct]);
  let guard=0;
  while(set.size<4 && guard++<300){
    const d = correct + rnd(-spread, spread);
    if(d!==correct && d>=0) set.add(d);
  }
  let extra=1;
  while(set.size<4){ set.add(Math.abs(correct)+extra); extra++; }   // Sicherheitsnetz
  return shuffle([...set]);   // kein sort(()=>Math.random()-0.5): das mischt nachweislich ungleich
}
