<!DOCTYPE html>
<html lang="de" data-theme="graphit">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Denksport</title>
<style>
  :root{ --radius:16px; }
  [data-theme="graphit"]{
    --bg:#101012; --card:#18181b; --card2:#202024; --txt:#ececec; --muted:#85858c; --line:#2a2a2e;
    --acc:#e0a44f; --on-acc:#231a08; --good:#54b388; --on-good:#07160e; --bad:#e06a6a; --on-bad:#1e0606;
  }
  [data-theme="papier"]{
    --bg:#f4f1ea; --card:#ffffff; --card2:#efe9dd; --txt:#23201b; --muted:#8f887b; --line:#e2ddd2;
    --acc:#23201b; --on-acc:#ffffff; --good:#2f9e6f; --on-good:#ffffff; --bad:#cf4b3f; --on-bad:#ffffff;
  }
  [data-theme="tinte"]{
    --bg:#ffffff; --card:#ffffff; --card2:#f2f2f2; --txt:#111111; --muted:#6a6a6a; --line:#111111;
    --acc:#111111; --on-acc:#ffffff; --good:#2b7a4b; --on-good:#ffffff; --bad:#b23b3b; --on-bad:#ffffff;
  }
  [data-theme="sepia"]{
    --bg:#ece3d0; --card:#f6efdf; --card2:#e6dcc6; --txt:#3a342a; --muted:#9c917b; --line:#d8ccb4;
    --acc:#b5591f; --on-acc:#ffffff; --good:#4f7d3a; --on-good:#ffffff; --bad:#b23b1f; --on-bad:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  #app{max-width:560px; margin:0 auto; padding:18px 16px 90px;}
  h1{font-size:26px; margin:6px 0 2px; letter-spacing:.3px;}
  h2{font-size:20px; margin:0 0 14px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .row{display:flex; gap:12px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat{flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 8px;}
  .stat .big{font-size:26px; font-weight:700;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  .module{cursor:pointer; transition:transform .08s ease, border-color .2s; position:relative; overflow:hidden;}
  .module:active{transform:scale(.97);}
  .module .emoji{font-size:30px;}
  .module .name{font-weight:700; margin-top:8px; font-size:16px;}
  .module .desc{color:var(--muted); font-size:12px; margin-top:3px; line-height:1.35;}
  .module .best{position:absolute; top:12px; right:14px; font-size:12px; color:var(--acc);}
  .btn{display:block; width:100%; border:0; border-radius:14px; padding:16px; font-size:17px;
       font-weight:700; color:var(--on-acc); background:var(--acc);
       cursor:pointer; transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:var(--card2); color:var(--txt); border:1px solid var(--line); font-weight:600;}
  .pill{display:inline-flex; align-items:center; gap:6px; background:var(--card2);
        border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--muted);}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .back{background:var(--card2); border:1px solid var(--line); color:var(--txt);
        border-radius:12px; padding:9px 14px; font-size:15px; cursor:pointer;}
  .prompt{font-size:46px; font-weight:800; text-align:center; margin:26px 0; letter-spacing:1px; min-height:56px;}
  .answers{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .ans{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:14px;
       padding:20px; font-size:24px; font-weight:700; cursor:pointer; transition:transform .06s, background .15s;}
  .ans:active{transform:scale(.97);}
  .ans.correct{background:var(--good); color:var(--on-good); border-color:var(--good);}
  .ans.wrong{background:var(--bad); color:var(--on-bad); border-color:var(--bad);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .key{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:14px;
       padding:18px; font-size:22px; font-weight:700; cursor:pointer;}
  .key:active{transform:scale(.96);}
  .display{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:16px;
           text-align:center; font-size:30px; font-weight:800; min-height:30px; letter-spacing:2px;}
  .bar{height:8px; background:var(--card2); border-radius:99px; overflow:hidden; margin:14px 0;}
  .bar > i{display:block; height:100%; background:var(--acc); width:0;
           transition:width .3s;}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .big-num{font-size:56px; font-weight:800;}
  .feedback{min-height:22px; font-weight:700; text-align:center; margin-top:8px;
            font-size:14px; line-height:1.45; padding:0 4px;}
  .chartrow{display:flex; align-items:flex-end; gap:6px; height:120px; margin-top:8px;}
  .chartrow > div{flex:1; background:var(--acc); border-radius:6px 6px 0 0; min-height:3px;}
  .chartlbl{display:flex; gap:6px; margin-top:4px;}
  .chartlbl > span{flex:1; text-align:center; font-size:10px; color:var(--muted);}
  .hidden{display:none;}
  .levelbar{height:6px; background:var(--card2); border-radius:99px; overflow:hidden; margin-top:12px;}
  .levelbar > i{display:block; height:100%; background:var(--acc); width:0;}
  .levellbl{font-size:11px; color:var(--muted); margin-top:5px;}
  /* Datenanalyse */
  .tzeit{height:5px; background:var(--card2); border-radius:99px; overflow:hidden; margin:2px 0 14px;}
  .tzeit > i{display:block; height:100%; width:100%; background:var(--acc);}
  .tcap{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .dtab{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums;}
  .dtab th,.dtab td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap;}
  .dtab th:first-child,.dtab td:first-child{text-align:left;}
  .dtab th{font-size:11px; color:var(--muted); font-weight:600; text-transform:none;}
  .tfrage{font-size:16px; font-weight:700; line-height:1.4; margin:16px 0 12px;}
  /* Prüfungssimulation */
  .ptop{display:flex; align-items:center; gap:12px; margin:10px 0 8px;}
  .pzeit{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .pzeit.knapp{color:var(--bad);}
  .ptop .muted{flex:1; font-size:13px;}
  .pstart{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .pstart .micon{flex:none;}
  .card.note{background:none; border-style:dashed; color:var(--muted);}
  .revtag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.4px;
          color:var(--acc); border:1px solid var(--acc); border-radius:999px; padding:3px 10px; margin-bottom:-6px;}
  .confetti-cvs{position:fixed; inset:0; pointer-events:none; z-index:9999;}
  .micon{color:var(--acc); line-height:0;}
  .shead{display:flex; align-items:center; gap:9px;}
  .hicon{color:var(--acc); display:inline-flex; line-height:0;}
  .ricon{color:var(--acc); display:flex; justify-content:center; margin-bottom:2px;}
  svg.ic{display:block;}
  /* XP-Balken */
  .xpwrap{margin:4px 0 16px;}
  .xprow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .xplvl{font-weight:800; font-size:16px;}
  .xpnum{font-size:12px; color:var(--muted);}
  .xpgain{color:var(--acc); font-weight:800; font-size:15px; margin-top:4px;}
  /* Tab-Leiste */
  .navbar{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card);
          border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:50;}
  .navb{flex:1; background:none; border:0; color:var(--muted); display:flex; flex-direction:column;
        align-items:center; gap:3px; font-size:11px; font-weight:600; cursor:pointer; padding:2px;}
  .navb.on{color:var(--acc);}
  /* Flow-Modus */
  .flowtop{display:flex; justify-content:space-between; align-items:center; margin:10px 0 2px;}
  .flives{display:flex; gap:5px;}
  .heart{line-height:0;} .heart.on{color:var(--bad);} .heart.off{color:var(--line);}
  .fscore{font-weight:800; font-size:18px;}
  .fcombo{height:24px; text-align:center; font-weight:800; color:var(--acc); font-size:16px; opacity:0; transition:opacity .2s;}
  .fcombo.show{opacity:1;}
  .prompt.small{font-size:30px;}
  .prompt.text{font-size:21px; line-height:1.45; font-weight:700; margin:20px 0 10px;}
  .einheit{text-align:center; font-size:12px; color:var(--muted); margin:0 0 14px;}
  .floatxp{position:fixed; transform:translate(-50%,0); color:var(--good); font-weight:800; font-size:20px;
           pointer-events:none; z-index:9998; transition:transform .7s ease-out, opacity .7s; opacity:1;}
  .floatxp.go{transform:translate(-50%,-46px); opacity:0;}
  .lvlchange{font-size:18px; font-weight:800; margin-top:6px;}
  .lvlchange.up{color:var(--good);} .lvlchange.down{color:var(--bad);} .lvlchange.same{color:var(--muted);}
  /* Logik-Schlüsse */
  .premise{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:8px 0; font-size:17px;}
  .concl{background:var(--card2); border:1px solid var(--acc); border-radius:12px; padding:16px; margin-top:14px; font-size:19px; font-weight:700; text-align:center;}
  .tf{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px;}
  .tf button{padding:22px; font-size:20px; font-weight:800; border-radius:14px; border:1px solid var(--line); cursor:pointer;}
  .tf .t{background:var(--good); color:var(--on-good);} .tf .f{background:var(--bad); color:var(--on-bad);}
  .tf button:active{transform:scale(.97);}
  /* Muster-Matrix */
  .matrix{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0;}
  .mcell{background:var(--card2); border:1px solid var(--line); border-radius:12px; aspect-ratio:1;
         display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:3px; padding:8px;
         font-size:19px; line-height:1; word-break:break-all; text-align:center;}
  .mcell.q{color:var(--acc); font-size:34px; font-weight:800;}
  .mopts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px;}
  .mopt{background:var(--card2); border:1px solid var(--line); border-radius:12px; aspect-ratio:1;
        display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px; padding:6px;
        cursor:pointer; font-size:15px; line-height:1; word-break:break-all; text-align:center;}
  .mopt:active{transform:scale(.95);}
  .mopt.correct{background:var(--good); color:var(--on-good);} .mopt.wrong{background:var(--bad); color:var(--on-bad);}
  /* N-Back */
  .nb-letter{font-size:96px; font-weight:800; text-align:center; margin:26px 0; height:110px; line-height:110px;}
  .nb-letter.pop{animation:nbpop .22s ease-out;}
  @keyframes nbpop{ from{ transform:scale(.82); opacity:.25; } to{ transform:scale(1); opacity:1; } }
  .nb-hit{width:100%; padding:22px; font-size:20px; font-weight:800; border:0; border-radius:14px;
          color:var(--on-acc); background:var(--acc); cursor:pointer;}
  .nb-hit:active{transform:scale(.98);} .nb-hit.flash{background:var(--good); color:var(--on-good);}
  .seq{font-size:40px; font-weight:800; text-align:center; letter-spacing:3px; margin:24px 0;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--card2);
         border:1px solid var(--line); padding:12px 18px; border-radius:12px; font-size:14px; opacity:0;
         transition:opacity .3s; pointer-events:none;}
  .toast.show{opacity:1;}
  label.opt{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); font-size:15px;}
  select{background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:15px;}
  .spacer{height:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------------- Datenhaltung ---------------- */
const DB = {
  load(){ try{ return JSON.parse(localStorage.getItem('denksport')||'{}'); }catch(e){ return {}; } },
  save(d){ localStorage.setItem('denksport', JSON.stringify(d)); },
};
let state = Object.assign({
  streak:0, lastDay:null, goal:3, todayCount:0, todayDay:null,
  best:{}, history:[],  // history: {day, module, score}
  mode:'grow',          // Schwierigkeit: 'grow' | 'easy' | 'medium' | 'hard'
  level:{},             // pro Modul dauerhaftes Level 1..10 (nur im 'grow'-Modus)
  sound:true,           // Sound-Effekte an/aus
  theme:'graphit',      // Design: 'graphit' | 'papier' | 'tinte' | 'sepia'
  xp:0,                 // Spieler-Erfahrungspunkte (globaler Fortschritt)
  v:2                   // Schema-Version (v1-Verlaufseinträge haben keine Genauigkeit)
}, DB.load());
state.v = 2;
if(typeof state.level!=='object' || !state.level) state.level={};

const MAXLVL = 10;
const DIFF_FIXED = { easy:2, medium:5, hard:8 };
const DIFF_LABEL = { grow:'Mitwachsend', easy:'Leicht', medium:'Mittel', hard:'Schwer' };

/* Lokales Datum, nicht UTC – sonst zählt eine Session nach Mitternacht auf den Vortag */
function todayStr(d=new Date()){
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function persist(){ DB.save(state); }

/* ---------------- Wiedervorlage falscher Aufgaben ----------------
   Aufgaben, die nie wiederkehren, hinterlassen nichts – ohne Wiedervorlage wird
   man in Endlosschleife geprüft statt trainiert. Nur beim Kopfrechnen sinnvoll:
   dort hat eine Aufgabe eine Identität (7 × 8 bleibt 7 × 8), bei Matrix und
   Zahlenreihen wäre "dieselbe Aufgabe" bloß eine zufällige Wiederholung. */
/* Wachsende Abstände in Tagen. Der günstige Abstand liegt bei 10–20 % der Zeit, über die
   man etwas behalten will; wer monatelang sicher rechnen will, braucht daher auch Abstände
   von Wochen. Expandierende Leitern schlagen gleichbleibende. */
const REVIEW_STEPS = [1, 3, 7, 21, 60];
function reviewList(mod){
  state.review = state.review || {};
  return (state.review[mod] = state.review[mod] || []);
}
function addDays(dayStr, n){
  const d = new Date(dayStr+'T12:00:00');          // Mittag umgeht Zeitzonen-Kanten
  d.setDate(d.getDate()+n);
  return todayStr(d);
}
function reviewDue(mod){
  const t = todayStr();
  return reviewList(mod).filter(r => r.due <= t);
}
/* Falsch beantwortet: neu aufnehmen bzw. auf Anfang zurücksetzen */
function reviewMiss(mod, item){
  const list = reviewList(mod);
  const ex = list.find(r => r.q === item.q);
  if(ex){ ex.step = 0; ex.due = addDays(todayStr(), REVIEW_STEPS[0]); }
  else list.push({q:item.q, ans:item.ans, cls:item.cls||'', hinweis:item.hinweis||'',
                  einheit:item.einheit||'', opts:item.opts||null,
                  step:0, due:addDays(todayStr(), REVIEW_STEPS[0])});
  if(list.length > 150) list.shift();
  persist();
}
/* Richtig beantwortet: nächste Stufe, nach der letzten gilt sie als gemeistert */
function reviewHit(mod, q){
  const list = reviewList(mod);
  const i = list.findIndex(r => r.q === q);
  if(i < 0) return;
  const r = list[i];
  r.step++;
  if(r.step >= REVIEW_STEPS.length) list.splice(i,1);
  else r.due = addDays(todayStr(), REVIEW_STEPS[r.step]);
  persist();
}

/* ---------------- Themes & Icons ---------------- */
const THEMES = { graphit:'Graphit', papier:'Papier', tinte:'Tinte', sepia:'Sepia' };
const THEME_BG = { graphit:'#101012', papier:'#f4f1ea', tinte:'#ffffff', sepia:'#ece3d0' };
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme||'graphit');
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=THEME_BG[state.theme]||'#101012';
}
/* Schlichte Linien-Icons (einfarbig, erben currentColor) */
const ICONS = {
  math:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="1" fill="currentColor" stroke="none"/>',
  seq:'<line x1="5" y1="20" x2="5" y2="15"/><line x1="10" y1="20" x2="10" y2="11"/><line x1="15" y1="20" x2="15" y2="8"/><line x1="20" y1="20" x2="20" y2="4"/>',
  memory:'<rect x="4" y="8" width="12" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/>',
  logic:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.9 1 1 1.7h5.2c.1-.7.5-1.3 1-1.7A6 6 0 0 0 12 3z"/>',
  matrix:'<circle cx="6" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="6" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="18" r="1.4" fill="none"/>',
  nback:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
  stats:'<line x1="4" y1="20" x2="20" y2="20"/><line x1="7" y1="20" x2="7" y2="13"/><line x1="12" y1="20" x2="12" y2="7"/><line x1="17" y1="20" x2="17" y2="15"/>',
  home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/>',
  flow:'<path d="M13 3L5 13h5l-1 8 8-11h-5l1-7z"/>',
  heart:'<path d="M12 20s-7-4.5-9.2-8.5C1.2 8.5 2.6 5 6 5c2 0 3.2 1.3 4 2.5C10.8 6.3 12 5 14 5c3.4 0 4.8 3.5 3.2 6.5C19 15.5 12 20 12 20z"/>',
  table:'<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="10" y1="9.5" x2="10" y2="20"/>',
  exam:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>'
};
function svgIcon(name, size){
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

/* Start-Schwierigkeit (1..10) für ein Modul – aus Level oder fester Stufe.
   Intern wird das Level mit Nachkommastellen geführt, gespielt wird die gerundete Stufe. */
function startLevel(mod){
  if(state.mode==='grow') return Math.max(1, Math.min(MAXLVL, Math.round(state.level[mod]||1)));
  return DIFF_FIXED[state.mode] || 3;
}
function shownLevel(mod){ return Math.round(state.level[mod]||1); }
/* Level speichern – nur im 'grow'-Modus, geklemmt auf 1..10 */
function saveLevel(mod, lvl){
  if(state.mode!=='grow') return;
  state.level[mod] = Math.max(1, Math.min(MAXLVL, lvl));
  persist();
}
/* Schwierigkeit auf eine Zieltrefferquote von 85 % einregeln – dem empirisch
   günstigsten Wert fürs Lernen (Wilson et al. 2019).

   Statt fester Schwellen ("hoch ab 90 %") wird proportional zur Abweichung nachgeführt.
   Feste Schwellen träfen den Zielwert nicht: Bei 10 Aufgaben ist die Quote in Zehnteln
   gequantelt, und die Module haben unterschiedlich viele Aufgaben (8 bis über 20) –
   der Gleichgewichtspunkt hinge damit an der Aufgabenzahl. Hier ist er per Konstruktion
   genau dort, wo die erwartete Quote 85 % beträgt, weil die Anpassung dann im Mittel
   null ist. Das Level wird intern mit Nachkommastellen geführt und pendelt sich
   zwischen zwei Stufen ein. */
const ACC_TARGET = 0.85, ACC_GAIN = 3;
function growByAccuracy(mod, lvl, correct, total){
  if(!total) return;
  const acc = correct/total;
  const basis = (state.mode==='grow' && typeof state.level[mod]==='number') ? state.level[mod] : lvl;
  saveLevel(mod, basis + ACC_GAIN*(acc - ACC_TARGET));
}

/* stats: {correct, total, secs, level} bzw. {span} bei Zahlen merken.
   Der Score bleibt Spielwertung; vergleichbar über Sessions hinweg ist nur acc bei gleichem Level. */
function registerSession(module, score, stats){
  const t = todayStr();
  // Streak-Logik
  if(state.lastDay !== t){
    const y = todayStr(new Date(Date.now()-86400000));
    state.streak = (state.lastDay === y) ? state.streak+1 : 1;
    state.lastDay = t;
  }
  // Tageszähler
  if(state.todayDay !== t){ state.todayDay = t; state.todayCount = 0; }
  state.todayCount++;
  // Bestwert
  if(!state.best[module] || score > state.best[module]) state.best[module] = score;
  // Verlauf
  const e = {day:t, module, score};
  if(stats){
    if(stats.total>0) e.acc = Math.round(stats.correct/stats.total*100);
    if(stats.secs)  e.secs = stats.secs;
    if(stats.level) e.lvl  = stats.level;
    if(stats.span)  e.span = stats.span;
  }
  state.history.push(e);
  if(state.history.length > 200) state.history.shift();
  persist();
}

}

/* ---------------- Sound (WebAudio) ---------------- */
const Sound = {
  ctx:null,
  ensure(){
    if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
  },
  beep(freq, dur=0.12, type='sine', when=0, vol=0.15){
    if(!state.sound) return; this.ensure(); if(!this.ctx) return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur);
  },
  correct(){ this.beep(660,0.10); this.beep(880,0.12,'sine',0.07); },
  wrong(){ this.beep(196,0.22,'square',0,0.12); },
  levelup(){ [523,659,784,1047].forEach((f,i)=>this.beep(f,0.15,'triangle',i*0.09,0.18)); },
};
/* Dezente Haptik (funktioniert v.a. auf Android; auf iOS harmloser No-Op) */
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
/* Richtig-/Falsch-Feedback gebündelt */
function fxCorrect(){ Sound.correct(); buzz(15); }
function fxWrong(){ Sound.wrong(); buzz([40,40,40]); }

/* ---------------- Konfetti ---------------- */
function confetti(){
  const cvs=document.createElement('canvas'); cvs.className='confetti-cvs';
  const dpr=window.devicePixelRatio||1, W=window.innerWidth, H=window.innerHeight;
  cvs.width=W*dpr; cvs.height=H*dpr; cvs.style.width=W+'px'; cvs.style.height=H+'px';
  document.body.appendChild(cvs);
  const ctx=cvs.getContext('2d'); ctx.scale(dpr,dpr);
  const colors=['#6c8cff','#8a6cff','#38d39f','#ffd166','#ff6b7a'];
  const parts=[];
  for(let i=0;i<130;i++) parts.push({
    x:W/2+(Math.random()-0.5)*100, y:H*0.32,
    vx:(Math.random()-0.5)*9, vy:Math.random()*-10-3, g:0.30,
    r:Math.random()*6+3, c:colors[i%colors.length], rot:Math.random()*6, vr:(Math.random()-0.5)*0.4
  });
  const t0=performance.now();
  (function frame(now){
    const el=now-t0; ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,1-el/1600); ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore();
    });
    if(el<1600) requestAnimationFrame(frame); else cvs.remove();
  })(t0);
}

/* Die Faktoren wachsen über die Levels vom kleinen Einmaleins bis zweistellig × zweistellig.
   Vorher endete Level 10 bei 13 × 13 – dort, wo Kopfrechnen erst anfängt, etwas zu bringen. */
function mulFactors(lv){
  if(lv<=3) return [rnd(2,3+lv), rnd(2,3+lv)];      // kleines Einmaleins
  if(lv<=6) return [rnd(2,12),   rnd(2,12)];        // volles Einmaleins
  if(lv<=8) return [rnd(11,29),  rnd(2,9)];         // zweistellig × einstellig
  return       [rnd(11,29),  rnd(11,19)];           // zweistellig × zweistellig
}
/* Prozent und Dreisatz kommen mit steigendem Level dazu. Beides zahlt im Alltag
   unmittelbar zurück – anders als reines Ziffernrechnen, das nur sich selbst trainiert. */
function genPercent(lv){
  const p = 5*rnd(1,lv<7?10:19);                 // Vielfaches von 5
  const base = 20*rnd(1, lv<7?10:20);            // Vielfaches von 20 -> Ergebnis ganzzahlig
  return {q:`${p} % von ${base}`, ans:p*base/100, kind:'percent', cls:'small',
          hinweis:`10 % von ${base} sind ${base/10} – also sind ${p} % davon ${p*base/100}.`};
}
function genDreisatz(lv){
  const unit = rnd(2, lv<8?12:25);               // Preis je Stück
  const a = rnd(2,9), c = rnd(2,12);
  return {q:`${a} Stück kosten ${a*unit} €.<br>Was kosten ${c} Stück?`,
          ans:c*unit, kind:'dreisatz', cls:'text',
          hinweis:`Ein Stück kostet ${a*unit} ÷ ${a} = ${unit} €, also kosten ${c} Stück ${c*unit} €.`};
}
/* ---- Finanz-Kopfrechnen ----
   Alltagsgrößen aus dem Asset Management. Die Ablenker sind jeweils der Fehler, den man
   an dieser Stelle tatsächlich macht – Zehnerpotenz vertan, Prozent mit Basispunkt
   verwechselt, symmetrisch gedacht, ungewichtet gemittelt. */
function genBpBetrag(lv){
  const bp  = pick([5,10,15,20,25,30,40,50,75,100]);
  const vol = 50*rnd(2, lv<8?12:24);                       // 100–600 bzw. 100–1200 Mio
  const ans = Math.round(vol*bp/10000*1000)/1000;
  return {kind:'bp_betrag', cls:'text', einheit:'Mio €',
    q:`Ein Fonds verwaltet ${num(vol)} Mio €.<br>Wie viel sind ${bp} Basispunkte davon?`,
    ans, opts:viereOptionen(ans, [vol*bp/100, vol*bp/1000, vol*bp/100000]),
    hinweis:`Ein Basispunkt ist 0,01 %. ${num(vol)} × ${bp} ÷ 10.000 = ${num(ans)} Mio €.`};
}
function genBetragBp(lv){
  const bp  = pick([10,15,20,25,30,40,50,60,75,90]);
  const vol = 50*rnd(2, 20);
  const geb = Math.round(vol*bp/10000*1000)/1000;
  return {kind:'betrag_bp', cls:'text', einheit:'bp',
    q:`Ein Fonds verwaltet ${num(vol)} Mio € und nimmt ${num(geb)} Mio € Gebühren ein.<br>Wie viel ist das in Basispunkten?`,
    ans:bp, opts:viereOptionen(bp, [bp/100, bp*10, bp/10]),
    // Über den Prozentwert erklären: Der reine Quotient (0,0025) wäre gerundet irreführend.
    hinweis:`${num(geb)} von ${num(vol)} Mio sind ${num(geb/vol*100)} % – und ${num(geb/vol*100)} % sind ${bp} bp.`};
}
function genProzentUmkehr(lv){
  const p = pick([10,20,25,50,60,75,80]);
  const ans = Math.round(p/(100-p)*100);
  return {kind:'prozent_umkehr', cls:'text', einheit:'%',
    q:`Ein Kurs fällt um ${p} %.<br>Um wie viel Prozent muss er steigen, um den Ausgangswert wieder zu erreichen?`,
    ans, opts:viereOptionen(ans, [p, 100-p, p*2]),
    hinweis:`Von 100 auf ${100-p} gefallen. Zurück auf 100 heißt ${100-p} × ${num(1+ans/100)}, also rund ${ans} % Anstieg.`};
}
function genRegel72(lv){
  const p = pick([2,3,4,6,8,9,12]);
  const ans = Math.round(72/p);
  return {kind:'regel72', cls:'text', einheit:'Jahre',
    q:`Ein Vermögen wächst mit ${p} % pro Jahr.<br>Wie lange dauert die Verdopplung ungefähr?`,
    ans, opts:viereOptionen(ans, [Math.round(100/p), Math.round(ans/2), ans*2]),
    hinweis:`Faustregel: 72 ÷ ${p} ≈ ${ans} Jahre.`};
}
function genGewichtet(lv){
  const w1 = 10*rnd(2,8), w2 = 100-w1;                     // Gewichte in Zehnerschritten
  const r1 = rnd(4,14), r2 = rnd(1,4);
  const ans = Math.round((w1*r1 + w2*r2)/100*100)/100;
  return {kind:'gewichtet', cls:'text', einheit:'%',
    q:`Ein Depot besteht zu ${w1} % aus Aktien (Rendite ${r1} %) und zu ${w2} % aus Anleihen (Rendite ${r2} %).<br>Wie hoch ist die Gesamtrendite?`,
    ans, opts:viereOptionen(ans, [(r1+r2)/2, r1+r2, (w2*r1 + w1*r2)/100]),
    hinweis:`${num(w1/100)} × ${r1} % + ${num(w2/100)} × ${r2} % = ${num(ans)} %.`};
}

function genMath(lv){
  const extra = [];
  if(lv>=4) extra.push(genPercent, genBpBetrag);
  if(lv>=5) extra.push(genRegel72);
  if(lv>=6) extra.push(genDreisatz, genProzentUmkehr);
  if(lv>=7) extra.push(genBetragBp);
  if(lv>=8) extra.push(genGewichtet);
  /* Auf höheren Stufen überwiegt die Anwendung, unten bleibt es reines Rechnen. */
  const arithAnteil = lv>=6 ? 0.45 : 0.6;
  if(extra.length && Math.random()>=arithAnteil) return pick(extra)(lv);

  const ops = lv<2 ? ['+','-'] : lv<4 ? ['+','-','×'] : ['+','-','×','÷'];
  const op = ops[Math.floor(Math.random()*ops.length)];
  const max = 8 + lv*10;
  let a=rnd(2,max), b=rnd(2,max), q, ans;
  if(op==='+'){ ans=a+b; q=`${a} + ${b}`; }
  else if(op==='-'){ while(b===a) b=rnd(2,max);          // sonst entstehen Aufgaben wie „14 − 14"
                     if(b>a)[a,b]=[b,a]; ans=a-b; q=`${a} − ${b}`; }
  else if(op==='×'){ [a,b]=mulFactors(lv); ans=a*b; q=`${a} × ${b}`; }
  else { let [x,y]=mulFactors(lv); if(y>12) y=rnd(3,12);   // Teiler bleibt handhabbar
         ans=x; b=y; a=x*y; q=`${a} ÷ ${b}`; }
  return {q, ans, kind:'arith', cls:''};
}
/* Weite Wertebereiche sind hier kein Selbstzweck: Der Aufgabenvorrat ist Start × Parameter.
   Zu enge Bereiche machen die Reihen nach wenigen Sessions wiedererkennbar statt denkbar. */
function genSeq(level){
  const types = level<2 ? 2 : level<4 ? 3 : level<6 ? 4 : 5;
  const type = Math.floor(Math.random()*types);
  let arr=[], next, start=rnd(1,20);
  if(type===0){ const d=rnd(2,4+level); arr=[start]; for(let i=0;i<4;i++)arr.push(arr[i]+d); next=arr[4]+d; }
  else if(type===1){ const r=rnd(2,3); start=(r===3)?rnd(1,6):rnd(1,15); arr=[start]; for(let i=0;i<4;i++)arr.push(arr[i]*r); next=arr[4]*r; }
  else if(type===2){ start=rnd(1,15); arr=[start]; let d=rnd(2,6); for(let i=0;i<4;i++){arr.push(arr[i]+d); d++;} next=arr[4]+d; }
  else if(type===3){ arr=[rnd(1,9), rnd(2,12)]; for(let i=0;i<3;i++)arr.push(arr[arr.length-1]+arr[arr.length-2]); next=arr[4]+arr[3]; }
  else { const c=rnd(1,5); start=rnd(1,6); arr=[start]; for(let i=0;i<4;i++)arr.push(arr[i]*2+c); next=arr[4]*2+c; }
  return {arr:arr.slice(0,5), next, type};
}
/* Die Prämissen werden gemischt ausgegeben. Stünden sie in Kettenreihenfolge, wäre die
   Antwort allein aus der Lesereihenfolge ablesbar – ohne transitives Schließen. */
function genLogic(L){
  const people = L<=2 ? 3 : L<=5 ? 4 : 5;
  const n=shuffle(NAMES).slice(0,people);       // n[0] hat die höchste Ausprägung
  const rel=pick(RELS);
  const pairs=[]; for(let k=0;k<people-1;k++) pairs.push([n[k], n[k+1]]);
  const shown=shuffle(pairs);
  const prem=shown.map(([a,b])=>`${a} ist ${rel.m} als ${b}.`);
  let i=rnd(0,people-1), j=rnd(0,people-1); while(j===i) j=rnd(0,people-1);
  const useMore=Math.random()<0.5;
  const truth=(useMore===(i<j));
  const concl=`${n[i]} ist ${useMore?rel.m:rel.l} als ${n[j]}.`;
  // premPairs/conclPair für Selbsttest und für die Erklärung nach einer falschen Antwort
  return {kind:'transitiv', prem, concl, truth, premPairs:shown,
          conclPair:[n[i], n[j]], conclMore:useMore, rel};
}
/* Rangfolge aus den Prämissen rekonstruieren: vom Kopf der Kette aus durchhangeln.
   Wird für die Erklärung nach einer falschen Antwort gebraucht (und im Selbsttest). */
function rankOrder(pairs){
  const next=new Map(), all=new Set(), lower=new Set();
  for(const [a,b] of pairs){ next.set(a,b); all.add(a); all.add(b); lower.add(b); }
  let cur=[...all].find(x=>!lower.has(x));
  const o=[];
  while(cur!==undefined && !o.includes(cur)){ o.push(cur); cur=next.get(cur); }
  return o.length===all.size ? o : null;
}
/* Form liegt auf der einen Achse, Anzahl auf der anderen: die Zeile verrät nur die
   Form, die Spalte nur die Anzahl – eine einzelne Zeile/Spalte reicht nie aus. */
function genMatrix(L){
  // Höheres Level: Formen dürfen aus derselben Familie stammen (● und ○) – schwerer zu unterscheiden
  const glyphs = shuffle(L>=4 ? SHAPE_SETS.flatMap(s=>[s.f,s.h]) : SHAPE_SETS.map(s=>s.f)).slice(0,3);
  const counts = shuffle(L>=4 ? [1,2,3,4,5,6] : [1,2,3,4]).slice(0,3);
  const shapeByRow = Math.random()<0.5;          // Form mal auf Zeilen-, mal auf Spaltenachse

  const mk=(s,n)=>({s,n});
  const grid=[];
  for(let r=0;r<3;r++){
    const row=[];
    for(let c=0;c<3;c++) row.push(mk(glyphs[shapeByRow?r:c], counts[shapeByRow?c:r]));
    grid.push(row);
  }

  const aS=glyphs[2], aN=counts[2];
  const otherS=glyphs.slice(0,2), otherN=counts.slice(0,2);
  const opts=[
    mk(aS, aN),                                  // richtig
    mk(pick(otherS), aN),                        // nur Form falsch
    mk(aS, pick(otherN)),                        // nur Anzahl falsch
    mk(pick(otherS), pick(otherN))               // beides falsch
  ];
  const answer=opts[0];
  return {grid, answer, opts:shuffle(opts)};
}
function matrixHtml(m){
  let cells='';
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const cell=m.grid[r][c];
    cells += (r===2&&c===2) ? `<div class="mcell q">?</div>` : `<div class="mcell">${cell.s.repeat(cell.n)}</div>`;
  }
  return `<div class="matrix">${cells}</div>
    <div class="mopts">${m.opts.map((o,i)=>`<div class="mopt" data-i="${i}">${o.s.repeat(o.n)}</div>`).join('')}</div>`;
}
function matrixIsCorrect(m, btn){ return m.opts[+btn.dataset.i]===m.answer; }
function matrixMarkAnswer(m){
  document.querySelectorAll('.mopt').forEach(b=>{ if(m.opts[+b.dataset.i]===m.answer) b.classList.add('correct'); });
}

/* Zahlen aus einer Tabelle lesen und beziehen – das Kernformat der Eignungstests im
   Finanzsektor (Aon/cut-e „scales numerical"). Der Trainingswert steckt in den Ablenkern:
   Sie sind keine Zufallszahlen, sondern die typischen Bezugsfehler. Wer die Tabelle richtig
   liest, aber falsch bezieht, landet auf einer Option statt danebenzuraten. */
const TABLE_THEMES = [
  {titel:'Fondsvolumen zum Jahresende', zeilenLabel:'Fonds',
   zeilen:['Alpha','Beta','Gamma','Delta','Epsilon'],
   spalten:[{kopf:'Volumen (Mio €)', min:6, max:90, faktor:10},
            {kopf:'Kunden (Tsd.)',   min:4, max:60, faktor:1}]},
  {titel:'Geschäftszahlen', zeilenLabel:'Jahr',
   zeilen:['2021','2022','2023','2024','2025'],
   spalten:[{kopf:'Umsatz (Mio €)', min:12, max:80, faktor:10},
            {kopf:'Kosten (Mio €)', min:5,  max:40, faktor:10}]},
  {titel:'Vermögen nach Region', zeilenLabel:'Region',
   zeilen:['Europa','Nordamerika','Asien','Sonstige'],
   spalten:[{kopf:'Volumen (Mio €)', min:8, max:70, faktor:10},
            {kopf:'Mandate',         min:6, max:45, faktor:1}]}
];
/* Deutsche Zahlschreibweise, höchstens zwei Nachkommastellen */
function num(x){
  const g = Math.round(x*1000)/1000;
  return (Number.isInteger(g) ? String(g) : String(+g.toFixed(3))).replace('.', ',');
}
/* Vier verschiedene, positive Antwortmöglichkeiten: zuerst die übergebenen Denkfallen,
   danach notfalls neutrale Auffüller im Abstand von rund 12 % der Lösung. */
function viereOptionen(ans, fallen){
  const opts=[], gesehen=new Set();
  const merke = v => {
    if(!Number.isFinite(v) || v<=0) return;
    const r=Math.round(v*1000)/1000, k=r.toFixed(3);
    if(!gesehen.has(k)){ gesehen.add(k); opts.push(r); }
  };
  merke(ans);
  fallen.forEach(merke);
  const schritt = Math.max(0.1, Math.round(Math.abs(ans)*0.12*10)/10) || 1;
  for(let n=1; opts.length<4 && n<200; n++){ merke(ans+schritt*n); merke(ans-schritt*n); }
  return shuffle(opts.slice(0,4));
}
function genTable(L){
  const th = pick(TABLE_THEMES);
  const anz = L<=2 ? 3 : L<=5 ? 4 : th.zeilen.length;
  const zeilenNamen = th.zeilen.slice(0, anz);
  /* Werte je Spalte paarweise verschieden – sonst ergeben Differenz und Verhältnis
     entartete Aufgaben (Unterschied null, Vielfaches genau eins). */
  const werte = zeilenNamen.map(()=> th.spalten.map(()=>0));
  th.spalten.forEach((s,ci)=>{
    const gesehen=new Set();
    zeilenNamen.forEach((_,ri)=>{
      let v, schutz=0;
      do{ v = rnd(s.min, s.max)*s.faktor; }while(gesehen.has(v) && schutz++<80);
      gesehen.add(v); werte[ri][ci]=v;
    });
  });
  const zeilen = zeilenNamen.map((label,i)=>({label, werte:werte[i]}));

  const arten = ['anteil','differenz'];
  if(L>=3) arten.push('veraenderung');
  if(L>=6) arten.push('verhaeltnis','prozentVon');
  const kind = pick(arten);

  const sp = rnd(0, th.spalten.length-1);                  // betrachtete Spalte
  const spalte = th.spalten[sp].kopf;
  const werteSp = zeilen.map(z=>z.werte[sp]);
  const summe = werteSp.reduce((a,b)=>a+b,0);
  const idx = shuffle(zeilen.map((_,i)=>i));
  const [i1, i2, i3] = idx;                                // drei verschiedene Zeilen

  let frage, ans, roh, erklaerung;
  if(kind==='anteil'){
    frage = `Welchen Anteil an der Spalte „${spalte}“ hat ${zeilen[i1].label}?`;
    ans = Math.round(werteSp[i1]/summe*100);
    roh = [ans,
           Math.round(werteSp[i1]/(summe-werteSp[i1])*100),      // Summe ohne den Wert selbst
           Math.round(werteSp[i2]/summe*100),                    // falsche Zeile
           Math.round(werteSp[i1]/Math.max(...werteSp)*100)];    // Anteil am größten statt an der Summe
    erklaerung = `${num(werteSp[i1])} von insgesamt ${num(summe)} sind ${ans} %.`;
  }else if(kind==='differenz'){
    const [a,b] = werteSp[i1]>=werteSp[i2] ? [i1,i2] : [i2,i1];
    frage = `Wie groß ist der Unterschied zwischen ${zeilen[a].label} und ${zeilen[b].label} in „${spalte}“?`;
    ans = werteSp[a]-werteSp[b];
    roh = [ans,
           werteSp[a]+werteSp[b],                                // addiert statt subtrahiert
           Math.abs(werteSp[a]-werteSp[i3]),                     // falsche Zeile
           Math.round((werteSp[a]-werteSp[b])/werteSp[b]*100)];  // relativ statt absolut
    erklaerung = `${num(werteSp[a])} − ${num(werteSp[b])} = ${num(ans)}.`;
  }else if(kind==='veraenderung'){
    /* Immer die größere Zeile als Bezugsziel: Die Aufgabe soll den Bezugsfehler trainieren,
       nicht zusätzlich das Vorzeichen. */
    const [hi,lo] = werteSp[i1]>=werteSp[i2] ? [i1,i2] : [i2,i1];
    const alt = werteSp[lo], neu = werteSp[hi];
    frage = `Um wie viel Prozent liegt ${zeilen[hi].label} über ${zeilen[lo].label} in „${spalte}“?`;
    ans = Math.round((neu-alt)/alt*100);
    roh = [ans,
           Math.round((neu-alt)/neu*100),                        // Bezug auf den neuen statt den alten Wert
           neu-alt,                                              // absolut statt relativ
           Math.round(neu/alt*100)];                             // Verhältnis statt Veränderung
    erklaerung = `(${num(neu)} − ${num(alt)}) ÷ ${num(alt)} = ${ans} %.`;
  }else if(kind==='verhaeltnis'){
    const [a,b] = werteSp[i1]>=werteSp[i2] ? [i1,i2] : [i2,i1];
    frage = `Wie viele Male so groß ist ${zeilen[a].label} wie ${zeilen[b].label} in „${spalte}“?`;
    ans = Math.round(werteSp[a]/werteSp[b]*10)/10;
    roh = [ans,
           Math.round(werteSp[b]/werteSp[a]*10)/10,              // Verhältnis umgedreht
           Math.round(werteSp[a]/werteSp[i3]*10)/10,             // falsche Zeile
           Math.round((werteSp[a]-werteSp[b])/werteSp[b]*10)/10];// Zuwachs statt Vielfaches
    erklaerung = `${num(werteSp[a])} ÷ ${num(werteSp[b])} = ${num(ans)}.`;
  }else{
    const p = pick([0.5, 0.75, 1, 1.5, 2]);
    frage = `Wie hoch ist eine Gebühr von ${num(p)} % auf ${zeilen[i1].label} in „${spalte}“?`;
    ans = Math.round(werteSp[i1]*p/100*100)/100;
    roh = [ans,
           Math.round(werteSp[i1]*p*100)/100,                    // Faktor 100 daneben
           Math.round(werteSp[i1]*p/1000*100)/100,               // Faktor 10 daneben
           Math.round(werteSp[i2]*p/100*100)/100];               // falsche Zeile
    erklaerung = `${num(werteSp[i1])} × ${num(p)} ÷ 100 = ${num(ans)}.`;
  }

  return {kind, titel:th.titel, zeilenLabel:th.zeilenLabel,
          kopf:th.spalten.map(s=>s.kopf), zeilen, frage, ans,
          opts:viereOptionen(ans, roh.slice(1)), erklaerung};
}

/* Bedingte Wahrscheinlichkeit in natürlichen Häufigkeiten ("9 von 108") statt in Prozent.
   Genau diese Darstellung macht die Aufgabe lösbar und hält an: In Trainingsstudien lagen
   die Trefferquoten nach fünf Wochen noch bei rund 90 %, während Regeltraining auf etwa
   20 % zurückfiel. Die Antwortoptionen enthalten bewusst die üblichen Denkfallen. */
const BAYES_STORIES=[
  {ganz:'Personen',  merkmal:'die Krankheit', ohne:'Gesunden',      pruef:'schlägt der Test bei', pruef2:'schlägt er fälschlich bei', treffer:'positiv Getesteten', ist:'wirklich krank'},
  {ganz:'E-Mails',   merkmal:'Spam',          ohne:'normalen',      pruef:'markiert der Filter',  pruef2:'markiert er fälschlich',   treffer:'markierten E-Mails', ist:'wirklich Spam'},
  {ganz:'Bauteile',  merkmal:'einen Defekt',  ohne:'einwandfreien', pruef:'erkennt die Prüfung',  pruef2:'schlägt sie fälschlich bei', treffer:'aussortierten Teile', ist:'wirklich defekt'}
];
function genBayes(L){
  const N = 1000;
  const betroffen = L<=3 ? 100 : L<=6 ? 50 : L<=8 ? 20 : 10;   // seltener = kontraintuitiver
  const rest = N - betroffen;
  const sens = pick([0.8, 0.9]);
  const fpr  = pick([0.05, 0.1]);
  const treffer = Math.round(betroffen*sens);
  const fehlalarm = Math.round(rest*fpr);
  const positiv = treffer + fehlalarm;
  const ans = Math.round(treffer/positiv*100);

  const s = pick(BAYES_STORIES);
  const lines = [
    `Von ${N} ${s.ganz} haben ${betroffen} ${s.merkmal}.`,
    `Von diesen ${betroffen} ${s.pruef} ${treffer} an.`,
    `Von den ${rest} ${s.ohne} ${s.pruef2} ${fehlalarm}.`
  ];
  const frage = `Wie viel Prozent der ${s.treffer} sind ${s.ist}?`;

  /* Denkfallen in dieser Reihenfolge: Trefferquote der Prüfung (häufigster Fehler),
     Grundrate, dann neutrale Füller – bis vier verschiedene Optionen zusammenkommen. */
  const opts=new Set([ans]);
  for(const t of [Math.round(sens*100), Math.round(betroffen/N*100), 50, 33, 75, 25, 95, 2, 66]){
    if(opts.size>=4) break;
    if(t!==ans) opts.add(t);
  }
  return {kind:'bayes', lines, frage, ans, opts:shuffle([...opts]),
          erklaerung:`${treffer} von ${positiv} ${s.treffer} sind ${s.ist} – das sind ${ans} %.`};
}

/* N-Back-Folge mit Lockvögeln: Wiederholungen im Abstand N-1 bzw. N+1, die KEINE Treffer sind.
   Ohne sie genügt das Gefühl "der kam doch gerade schon vor" – man müsste die Position nie mitzählen.
   Nicht-Treffer werden zusätzlich so gewählt, dass sie nicht zufällig zum Treffer oder Lockvogel werden. */
const NB_POOL=['C','H','K','L','Q','R','S','T'];
function genNBack(N, len){
  const seq=[];
  const lureDists = k => [N-1, N+1].filter(d=>d>=1 && d!==N && k-d>=0);
  for(let k=0;k<len;k++){
    const canTarget = k>=N;
    const lures = lureDists(k);
    const r = Math.random();
    let ch = null;
    if(canTarget && r<0.30){
      ch = seq[k-N];                                       // echter Treffer
    }else if(lures.length && r<0.52){
      const cand = seq[k-pick(lures)];
      if(!canTarget || cand!==seq[k-N]) ch = cand;         // Lockvogel, aber kein Treffer
    }
    if(ch===null){                                         // klarer Nicht-Treffer
      const tabu = new Set();
      if(canTarget) tabu.add(seq[k-N]);
      for(const d of lures) tabu.add(seq[k-d]);
      const frei = NB_POOL.filter(c=>!tabu.has(c));
      ch = pick(frei.length?frei:NB_POOL);
    }
    seq.push(ch);
  }
  const isTarget = (c,k) => k>=N && c===seq[k-N];
  let targets = seq.filter(isTarget).length;
  if(targets===0 && len>N){                                // ein Lauf ohne Treffer wäre nicht auswertbar
    const k = rnd(N, len-1);
    seq[k] = seq[k-N];
    targets = seq.filter(isTarget).length;
  }
  const lureCount = seq.filter((c,k)=>
    !isTarget(c,k) && lureDists(k).some(d=>c===seq[k-d])).length;
  return {seq, targets, lures:lureCount, N};
}

/* ---------------- Prüfungssimulation ----------------
   Nachbildung des Auswahlverfahrens: Gesamtzeit statt Zeit je Aufgabe, keine
   Zwischenrückmeldung, danach Auswertung. Die Schwierigkeit ist bewusst FEST –
   nur so sind zwei Läufe im Abstand von Wochen überhaupt vergleichbar. Das Ergebnis
   fließt aus demselben Grund nicht in die adaptive Levelsteuerung ein: Es ist eine
   Messung, kein Training. */
const PRUEF_LEVEL = 8;
const PRUEF_FORMATE = {
  kurz: {n:18, sek:360, name:'Kurzform', text:'18 Aufgaben in 6 Minuten'},
  lang: {n:37, sek:720, name:'Langform', text:'37 Aufgaben in 12 Minuten'}
};
const AUFGABEN_NAMEN = {
  anteil:'Anteil an der Summe', differenz:'Differenz', veraenderung:'Prozentuale Veränderung',
  verhaeltnis:'Verhältnis', prozentVon:'Prozent von einem Wert',
  arith:'Grundrechenarten', percent:'Prozentrechnung', dreisatz:'Dreisatz',
  bp_betrag:'Basispunkte → Betrag', betrag_bp:'Betrag → Basispunkte',
  prozent_umkehr:'Prozentuale Umkehr', regel72:'72er-Regel', gewichtet:'Gewichtete Rendite'
};
/* Rund 60 % Tabellenaufgaben – das ist im echten Test das vorherrschende Format. */
function pruefungsAufgaben(n){
  const items=[];
  for(let i=0;i<n;i++){
    if(Math.random()<0.6){
      const g=genTable(PRUEF_LEVEL);
      items.push({typ:'table', kind:g.kind, g, ans:g.ans, opts:g.opts});
    }else{
      const g=genMath(PRUEF_LEVEL);
      items.push({typ:'math', kind:g.kind, g, ans:g.ans, opts:g.opts||distractors(g.ans)});
    }
  }
  return items;
}
function mmss(s){ return Math.floor(s/60)+':'+String(Math.max(0,s%60)).padStart(2,'0'); }

/* ---------------- Spieler-XP & Level ---------------- */
function playerLevel(xp){
  let lvl=1, need=120, acc=0;
  while(xp >= acc+need){ acc+=need; lvl++; need=Math.round(need*1.3); }
  return {level:lvl, into:xp-acc, need, floor:acc};
}
function gainXP(amount){
  const before = playerLevel(state.xp||0).level;
  state.xp = (state.xp||0) + amount;
  const after = playerLevel(state.xp).level;
  persist();
  return { gained:amount, leveledUp:after>before, level:after };
}

/* ---------------- Modul 1: Kopfrechnen ---------------- */
SCREENS.math = function(){
  const TOTAL = 10;
  /* Das Level bleibt während der Session fest. Stiege es nach jeder richtigen Antwort,
     wäre das eine 1-hoch/1-runter-Treppe – die pendelt sich bei 50 % Trefferquote ein,
     weit unter dem günstigen Bereich. Angepasst wird erst am Ende, über die Trefferquote.
     Nebeneffekt: Bei fester Schwierigkeit ist die Quote über Sessions vergleichbar. */
  const L0=startLevel('math');
  let idx=0, correct=0, startAll=Date.now();
  sessionShell('math');

  let current, answered=false, isReview=false, reviewDone=0;
  function render(){
    /* Fällige Wiederholungen zuerst, aber höchstens jede zweite Aufgabe –
       eine Session soll nicht nur aus alten Fehlern bestehen. */
    const due = reviewDue('math');
    isReview = due.length>0 && reviewDone < Math.ceil(TOTAL/2) && Math.random()<0.6;
    current = isReview ? pick(due) : genMath(L0);
    if(isReview) reviewDone++;
    answered=false;
    setHud(`${idx+1}/${TOTAL} · Level ${L0}`);
    // Finanzaufgaben liefern eigene Optionen mit; sonst die generischen Ablenker
    const opts = current.opts || distractors(current.ans);
    document.getElementById('body').innerHTML = `
      ${isReview?'<div class="revtag">Wiederholung</div>':''}
      <div class="prompt ${current.cls||''}">${current.q}</div>
      ${current.einheit?`<div class="einheit">Antwort in ${current.einheit}</div>`:''}
      <div class="answers">
        ${opts.map(o=>`<button class="ans" data-v="${o}">${num(o)}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="bar"><i style="width:${idx/TOTAL*100}%"></i></div>
    `;
    document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>choose(b));
  }
  function choose(btn){        // heißt bewusst nicht pick(): das würde den globalen Zufalls-Helfer verdecken
    if(answered) return; answered=true;
    let erklaert=false;        // längere Pause, wenn ein Rechenweg zu lesen ist
    const v = +btn.dataset.v;
    if(Math.abs(v - current.ans) < 1e-9){      // Toleranz wegen Nachkommastellen
      btn.classList.add('correct'); correct++; fxCorrect();
      document.getElementById('fb').textContent='✔ Richtig';
      if(isReview) reviewHit('math', current.q);
    }else{
      btn.classList.add('wrong'); fxWrong();
      document.querySelectorAll('.ans').forEach(b=>{
        if(Math.abs(+b.dataset.v - current.ans) < 1e-9) b.classList.add('correct'); });
      // Bei den angewandten Aufgaben den Rechenweg zeigen, nicht nur die Lösung
      document.getElementById('fb').textContent = current.hinweis ? '✗ '+current.hinweis
                                                                 : '✗ Falsch: '+num(current.ans);
      erklaert = !!current.hinweis;
      reviewMiss('math', current);
    }
    idx++;
    laterIfActive(()=>{ idx<TOTAL ? render() : finish(); }, erklaert ? 2600 : 650);
  }
  function finish(){
    const secs = Math.round((Date.now()-startAll)/1000);
    const score = correct*10 + Math.max(0, L0*5) - secs;   // Zeitabzug bleibt: siehe Kommentar in SCREENS.seq
    const sc = Math.max(0, score);
    growByAccuracy('math', L0, correct, TOTAL);
    registerSession('math', sc, {correct, total:TOTAL, secs, level:L0});
    resultScreen('🧮 Kopfrechnen', correct, TOTAL, sc, secs, 'math', '', levelInfo('math', L0));
  }
  render();
};

};

      else if(k==='ok'){ check(entered,digits); return; }
      else if(entered.length<level) entered+=k;
      disp.textContent = entered || ' ';
    });
  }
  function check(entered, digits){
    if(entered===digits){
      best=Math.max(best,level); level++; fxCorrect();
      document.getElementById('fb').textContent='✔ Richtig!';
      laterIfActive(newRound, 700);
    }else{
      lives--; fxWrong();
      document.getElementById('fb').textContent='✗ Falsch – war '+digits;
      if(lives<=0){
        const sc=best*20 + (round-1)*3;
        saveLevel('memory', Math.max(D0, best-2));   // Level wächst mit erreichter Länge
        registerSession('memory', sc, {span:best});
        laterIfActive(()=>resultScreen('🧠 Zahlen merken', best, best, sc, 0, 'memory', `Beste Länge: ${best} Ziffern`, levelInfo('memory', D0)), 900);
      }else laterIfActive(newRound, 900);
    }
  }
  newRound();
};

SCREENS.logic = function(){
  const TOTAL=8; let idx=0, correct=0, startAll=Date.now();
  const L=startLevel('logic');
  sessionShell('logic');
  let cur, answered=false;
  function render(){
    setHud(`${idx+1}/${TOTAL} · Lvl ${L}`);
    /* Ab Level 2 mischen sich Aufgaben zur bedingten Wahrscheinlichkeit dazu.
       Bewusst nicht im Flow-Modus: Sie brauchen Bedenkzeit, kein Tempo. */
    cur = (L>=2 && Math.random()<0.35) ? genBayes(L) : genLogic(L);
    answered=false;
    document.getElementById('body').innerHTML = cur.kind==='bayes' ? `
      <p class="muted">Angenommen, das Folgende stimmt:</p>
      ${cur.lines.map(p=>`<div class="premise">${p}</div>`).join('')}
      <p class="muted center" style="margin-top:14px;">${cur.frage}</p>
      <div class="answers">${cur.opts.map(o=>`<button class="ans" data-v="${o}">${o} %</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>` : `
      <p class="muted">Angenommen, das Folgende stimmt:</p>
      ${cur.prem.map(p=>`<div class="premise">${p}</div>`).join('')}
      <p class="muted center" style="margin-top:14px;">Folgt daraus zwingend:</p>
      <div class="concl">${cur.concl}</div>
      <div class="tf">
        <button class="t" data-v="true">WAHR</button>
        <button class="f" data-v="false">FALSCH</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    document.querySelectorAll(cur.kind==='bayes' ? '.ans' : '.tf button')
      .forEach(b=>b.onclick=()=>choose(b));
  }
  function choose(btn){
    if(answered)return; answered=true;
    const ok = cur.kind==='bayes'
      ? +btn.dataset.v===cur.ans
      : (btn.dataset.v==='true')===cur.truth;
    const fb=document.getElementById('fb');
    if(ok){
      correct++; fxCorrect();
      if(cur.kind==='bayes') btn.classList.add('correct');
      fb.textContent='✔ Richtig';
    }else{
      fxWrong();
      if(cur.kind==='bayes'){
        btn.classList.add('wrong');
        document.querySelectorAll('.ans').forEach(b=>{ if(+b.dataset.v===cur.ans) b.classList.add('correct'); });
        fb.textContent='✗ '+cur.erklaerung;                   // Rechenweg statt nur der Lösung
      }else{
        const o=rankOrder(cur.premPairs);                     // hergeleitete Rangfolge zeigen
        fb.textContent = o ? `✗ Reihenfolge: ${o.join(' → ')}`
                           : '✗ Richtig wäre: '+(cur.truth?'WAHR':'FALSCH');
      }
    }
    idx++; laterIfActive(()=> idx<TOTAL?render():finish(), cur.kind==='bayes'||!ok ? 2200 : 950);
  }
  function finish(){
    const secs=Math.round((Date.now()-startAll)/1000);
    const sc=Math.max(0, correct*18);          // kein Zeitabzug beim Schlussfolgern
    growByAccuracy('logic', L, correct, TOTAL);
    registerSession('logic', sc, {correct, total:TOTAL, secs, level:L});
    resultScreen('🤔 Logik-Schlüsse', correct, TOTAL, sc, secs, 'logic', '', levelInfo('logic', L));
  }
  render();
};

SCREENS.table = function(){
  const TOTAL=8, ZEIT=60;                    // Sekunden je Aufgabe
  const L=startLevel('table');
  let idx=0, correct=0, startAll=Date.now();
  sessionShell('table');
  let cur, answered=false, frageNr=0;

  function render(){
    const meine = ++frageNr;     // eigene Kennung: der Wecker darf nur die eigene Aufgabe treffen
    setHud(`${idx+1}/${TOTAL} · Lvl ${L}`);
    cur=genTable(L); answered=false;
    document.getElementById('body').innerHTML=`
      <div class="tzeit"><i id="tbar"></i></div>
      ${tabelleHtml(cur)}
      <div class="answers">${cur.opts.map(o=>`<button class="ans" data-v="${o}">${num(o)}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>`;
    document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>choose(b));
    /* Zeitbalken rein über CSS-Übergang, dazu genau ein abgesicherter Zeitgeber für den
       Ablauf – kein Intervall, das beim Bildschirmwechsel aufgeräumt werden müsste. */
    const bar=document.getElementById('tbar');
    requestAnimationFrame(()=>{ bar.style.transition=`width ${ZEIT}s linear`; bar.style.width='0%'; });
    laterIfActive(()=>{ if(meine===frageNr && !answered) choose(null); }, ZEIT*1000);
  }

  function choose(btn){
    if(answered) return; answered=true;
    const bar=document.getElementById('tbar');
    if(bar){ bar.style.transition='none'; bar.style.width=getComputedStyle(bar).width; }
    const ok = btn && Math.abs(+btn.dataset.v - cur.ans) < 1e-9;
    if(ok){ btn.classList.add('correct'); correct++; fxCorrect(); }
    else{
      if(btn) btn.classList.add('wrong');
      fxWrong();
      document.querySelectorAll('.ans').forEach(b=>{
        if(Math.abs(+b.dataset.v - cur.ans) < 1e-9) b.classList.add('correct');
      });
    }
    document.getElementById('fb').textContent =
      ok ? '✔ Richtig' : (btn ? '✗ ' : '⏱ Zeit abgelaufen – ') + cur.erklaerung;
    idx++;
    laterIfActive(()=> idx<TOTAL ? render() : finish(), ok ? 900 : 2600);
  }

  function finish(){
    const secs=Math.round((Date.now()-startAll)/1000);
    const sc=Math.max(0, correct*20);        // kein Zeitabzug: das Zeitlimit steckt schon in der Aufgabe
    growByAccuracy('table', L, correct, TOTAL);
    registerSession('table', sc, {correct, total:TOTAL, secs, level:L});
    resultScreen('📊 Datenanalyse', correct, TOTAL, sc, secs, 'table', '', levelInfo('table', L));
  }
  render();
};
