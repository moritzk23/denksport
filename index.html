<!DOCTYPE html>
<html lang="de" data-theme="graphit">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Denksport</title>
<style>
  :root{ --radius:16px; }
  [data-theme="graphit"]{
    --bg:#101012; --card:#18181b; --card2:#202024; --txt:#ececec; --muted:#85858c; --line:#2a2a2e;
    --acc:#e0a44f; --on-acc:#231a08; --good:#54b388; --on-good:#07160e; --bad:#e06a6a; --on-bad:#1e0606;
  }
  [data-theme="papier"]{
    --bg:#f4f1ea; --card:#ffffff; --card2:#efe9dd; --txt:#23201b; --muted:#8f887b; --line:#e2ddd2;
    --acc:#23201b; --on-acc:#ffffff; --good:#2f9e6f; --on-good:#ffffff; --bad:#cf4b3f; --on-bad:#ffffff;
  }
  [data-theme="tinte"]{
    --bg:#ffffff; --card:#ffffff; --card2:#f2f2f2; --txt:#111111; --muted:#6a6a6a; --line:#111111;
    --acc:#111111; --on-acc:#ffffff; --good:#2b7a4b; --on-good:#ffffff; --bad:#b23b3b; --on-bad:#ffffff;
  }
  [data-theme="sepia"]{
    --bg:#ece3d0; --card:#f6efdf; --card2:#e6dcc6; --txt:#3a342a; --muted:#9c917b; --line:#d8ccb4;
    --acc:#b5591f; --on-acc:#ffffff; --good:#4f7d3a; --on-good:#ffffff; --bad:#b23b1f; --on-bad:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  #app{max-width:560px; margin:0 auto; padding:18px 16px 90px;}
  h1{font-size:26px; margin:6px 0 2px; letter-spacing:.3px;}
  h2{font-size:20px; margin:0 0 14px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .row{display:flex; gap:12px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat{flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 8px;}
  .stat .big{font-size:26px; font-weight:700;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  .module{cursor:pointer; transition:transform .08s ease, border-color .2s; position:relative; overflow:hidden;}
  .module:active{transform:scale(.97);}
  .module .emoji{font-size:30px;}
  .module .name{font-weight:700; margin-top:8px; font-size:16px;}
  .module .desc{color:var(--muted); font-size:12px; margin-top:3px; line-height:1.35;}
  .module .best{position:absolute; top:12px; right:14px; font-size:12px; color:var(--acc);}
  .btn{display:block; width:100%; border:0; border-radius:14px; padding:16px; font-size:17px;
       font-weight:700; color:var(--on-acc); background:var(--acc);
       cursor:pointer; transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:var(--card2); color:var(--txt); border:1px solid var(--line); font-weight:600;}
  .pill{display:inline-flex; align-items:center; gap:6px; background:var(--card2);
        border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--muted);}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .back{background:var(--card2); border:1px solid var(--line); color:var(--txt);
        border-radius:12px; padding:9px 14px; font-size:15px; cursor:pointer;}
  .prompt{font-size:46px; font-weight:800; text-align:center; margin:26px 0; letter-spacing:1px; min-height:56px;}
  .answers{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .ans{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:14px;
       padding:20px; font-size:24px; font-weight:700; cursor:pointer; transition:transform .06s, background .15s;}
  .ans:active{transform:scale(.97);}
  .ans.correct{background:var(--good); color:var(--on-good); border-color:var(--good);}
  .ans.wrong{background:var(--bad); color:var(--on-bad); border-color:var(--bad);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .key{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:14px;
       padding:18px; font-size:22px; font-weight:700; cursor:pointer;}
  .key:active{transform:scale(.96);}
  .display{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:16px;
           text-align:center; font-size:30px; font-weight:800; min-height:30px; letter-spacing:2px;}
  .bar{height:8px; background:var(--card2); border-radius:99px; overflow:hidden; margin:14px 0;}
  .bar > i{display:block; height:100%; background:var(--acc); width:0;
           transition:width .3s;}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .big-num{font-size:56px; font-weight:800;}
  .feedback{height:22px; font-weight:700; text-align:center; margin-top:6px;}
  .chartrow{display:flex; align-items:flex-end; gap:6px; height:120px; margin-top:8px;}
  .chartrow > div{flex:1; background:var(--acc); border-radius:6px 6px 0 0; min-height:3px;}
  .hidden{display:none;}
  .levelbar{height:6px; background:var(--card2); border-radius:99px; overflow:hidden; margin-top:12px;}
  .levelbar > i{display:block; height:100%; background:var(--acc); width:0;}
  .levellbl{font-size:11px; color:var(--muted); margin-top:5px;}
  .confetti-cvs{position:fixed; inset:0; pointer-events:none; z-index:9999;}
  .micon{color:var(--acc); line-height:0;}
  .shead{display:flex; align-items:center; gap:9px;}
  .hicon{color:var(--acc); display:inline-flex; line-height:0;}
  .ricon{color:var(--acc); display:flex; justify-content:center; margin-bottom:2px;}
  svg.ic{display:block;}
  /* XP-Balken */
  .xpwrap{margin:4px 0 16px;}
  .xprow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .xplvl{font-weight:800; font-size:16px;}
  .xpnum{font-size:12px; color:var(--muted);}
  .xpgain{color:var(--acc); font-weight:800; font-size:15px; margin-top:4px;}
  /* Tab-Leiste */
  .navbar{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card);
          border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:50;}
  .navb{flex:1; background:none; border:0; color:var(--muted); display:flex; flex-direction:column;
        align-items:center; gap:3px; font-size:11px; font-weight:600; cursor:pointer; padding:2px;}
  .navb.on{color:var(--acc);}
  /* Flow-Modus */
  .flowtop{display:flex; justify-content:space-between; align-items:center; margin:10px 0 2px;}
  .flives{display:flex; gap:5px;}
  .heart{line-height:0;} .heart.on{color:var(--bad);} .heart.off{color:var(--line);}
  .fscore{font-weight:800; font-size:18px;}
  .fcombo{height:24px; text-align:center; font-weight:800; color:var(--acc); font-size:16px; opacity:0; transition:opacity .2s;}
  .fcombo.show{opacity:1;}
  .prompt.small{font-size:30px;}
  .floatxp{position:fixed; transform:translate(-50%,0); color:var(--good); font-weight:800; font-size:20px;
           pointer-events:none; z-index:9998; transition:transform .7s ease-out, opacity .7s; opacity:1;}
  .floatxp.go{transform:translate(-50%,-46px); opacity:0;}
  .lvlchange{font-size:18px; font-weight:800; margin-top:6px;}
  .lvlchange.up{color:var(--good);} .lvlchange.down{color:var(--bad);} .lvlchange.same{color:var(--muted);}
  /* Logik-Schlüsse */
  .premise{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:8px 0; font-size:17px;}
  .concl{background:var(--card2); border:1px solid var(--acc); border-radius:12px; padding:16px; margin-top:14px; font-size:19px; font-weight:700; text-align:center;}
  .tf{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px;}
  .tf button{padding:22px; font-size:20px; font-weight:800; border-radius:14px; border:1px solid var(--line); cursor:pointer;}
  .tf .t{background:var(--good); color:var(--on-good);} .tf .f{background:var(--bad); color:var(--on-bad);}
  .tf button:active{transform:scale(.97);}
  /* Muster-Matrix */
  .matrix{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0;}
  .mcell{background:var(--card2); border:1px solid var(--line); border-radius:12px; aspect-ratio:1;
         display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:3px; padding:8px;
         font-size:19px; line-height:1; word-break:break-all; text-align:center;}
  .mcell.q{color:var(--acc); font-size:34px; font-weight:800;}
  .mopts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px;}
  .mopt{background:var(--card2); border:1px solid var(--line); border-radius:12px; aspect-ratio:1;
        display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px; padding:6px;
        cursor:pointer; font-size:15px; line-height:1; word-break:break-all; text-align:center;}
  .mopt:active{transform:scale(.95);}
  .mopt.correct{background:var(--good); color:var(--on-good);} .mopt.wrong{background:var(--bad); color:var(--on-bad);}
  /* N-Back */
  .nb-letter{font-size:96px; font-weight:800; text-align:center; margin:26px 0; height:110px; line-height:110px;}
  .nb-letter.pop{animation:nbpop .22s ease-out;}
  @keyframes nbpop{ from{ transform:scale(.82); opacity:.25; } to{ transform:scale(1); opacity:1; } }
  .nb-hit{width:100%; padding:22px; font-size:20px; font-weight:800; border:0; border-radius:14px;
          color:var(--on-acc); background:var(--acc); cursor:pointer;}
  .nb-hit:active{transform:scale(.98);} .nb-hit.flash{background:var(--good); color:var(--on-good);}
  .seq{font-size:40px; font-weight:800; text-align:center; letter-spacing:3px; margin:24px 0;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--card2);
         border:1px solid var(--line); padding:12px 18px; border-radius:12px; font-size:14px; opacity:0;
         transition:opacity .3s; pointer-events:none;}
  .toast.show{opacity:1;}
  label.opt{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); font-size:15px;}
  select{background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:15px;}
  .spacer{height:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------------- Datenhaltung ---------------- */
const DB = {
  load(){ try{ return JSON.parse(localStorage.getItem('denksport')||'{}'); }catch(e){ return {}; } },
  save(d){ localStorage.setItem('denksport', JSON.stringify(d)); },
};
let state = Object.assign({
  streak:0, lastDay:null, goal:3, todayCount:0, todayDay:null,
  best:{}, history:[],  // history: {day, module, score}
  mode:'grow',          // Schwierigkeit: 'grow' | 'easy' | 'medium' | 'hard'
  level:{},             // pro Modul dauerhaftes Level 1..10 (nur im 'grow'-Modus)
  sound:true,           // Sound-Effekte an/aus
  theme:'graphit',      // Design: 'graphit' | 'papier' | 'tinte' | 'sepia'
  xp:0                  // Spieler-Erfahrungspunkte (globaler Fortschritt)
}, DB.load());
if(typeof state.level!=='object' || !state.level) state.level={};

const MAXLVL = 10;
const DIFF_FIXED = { easy:2, medium:5, hard:8 };
const DIFF_LABEL = { grow:'Mitwachsend', easy:'Leicht', medium:'Mittel', hard:'Schwer' };

function todayStr(){ return new Date().toISOString().slice(0,10); }
function persist(){ DB.save(state); }

/* ---------------- Themes & Icons ---------------- */
const THEMES = { graphit:'Graphit', papier:'Papier', tinte:'Tinte', sepia:'Sepia' };
const THEME_BG = { graphit:'#101012', papier:'#f4f1ea', tinte:'#ffffff', sepia:'#ece3d0' };
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme||'graphit');
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=THEME_BG[state.theme]||'#101012';
}
/* Schlichte Linien-Icons (einfarbig, erben currentColor) */
const ICONS = {
  math:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="1" fill="currentColor" stroke="none"/>',
  seq:'<line x1="5" y1="20" x2="5" y2="15"/><line x1="10" y1="20" x2="10" y2="11"/><line x1="15" y1="20" x2="15" y2="8"/><line x1="20" y1="20" x2="20" y2="4"/>',
  memory:'<rect x="4" y="8" width="12" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/>',
  logic:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.9 1 1 1.7h5.2c.1-.7.5-1.3 1-1.7A6 6 0 0 0 12 3z"/>',
  matrix:'<circle cx="6" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="6" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="18" r="1.4" fill="none"/>',
  nback:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
  stats:'<line x1="4" y1="20" x2="20" y2="20"/><line x1="7" y1="20" x2="7" y2="13"/><line x1="12" y1="20" x2="12" y2="7"/><line x1="17" y1="20" x2="17" y2="15"/>',
  home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/>',
  flow:'<path d="M13 3L5 13h5l-1 8 8-11h-5l1-7z"/>',
  heart:'<path d="M12 20s-7-4.5-9.2-8.5C1.2 8.5 2.6 5 6 5c2 0 3.2 1.3 4 2.5C10.8 6.3 12 5 14 5c3.4 0 4.8 3.5 3.2 6.5C19 15.5 12 20 12 20z"/>'
};
function svgIcon(name, size){
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

/* Start-Schwierigkeit (1..10) für ein Modul – aus Level oder fester Stufe */
function startLevel(mod){
  if(state.mode==='grow') return Math.max(1, Math.min(MAXLVL, state.level[mod]||1));
  return DIFF_FIXED[state.mode] || 3;
}
/* Level speichern – nur im 'grow'-Modus, geklemmt auf 1..10 */
function saveLevel(mod, lvl){
  if(state.mode!=='grow') return;
  state.level[mod] = Math.max(1, Math.min(MAXLVL, Math.round(lvl)));
  persist();
}
/* Level am Session-Ende anhand der Trefferquote anpassen (nicht-fortlaufende Module) */
function growByAccuracy(mod, lvl, correct, total){
  const acc = total ? correct/total : 0;
  saveLevel(mod, lvl + (acc>=0.8 ? 1 : acc<0.5 ? -1 : 0));
}

function registerSession(module, score){
  const t = todayStr();
  // Streak-Logik
  if(state.lastDay !== t){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    state.streak = (state.lastDay === y) ? state.streak+1 : 1;
    state.lastDay = t;
  }
  // Tageszähler
  if(state.todayDay !== t){ state.todayDay = t; state.todayCount = 0; }
  state.todayCount++;
  // Bestwert
  if(!state.best[module] || score > state.best[module]) state.best[module] = score;
  // Verlauf
  state.history.push({day:t, module, score});
  if(state.history.length > 60) state.history.shift();
  persist();
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1600);
}

/* ---------------- Sound (WebAudio) ---------------- */
const Sound = {
  ctx:null,
  ensure(){
    if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
  },
  beep(freq, dur=0.12, type='sine', when=0, vol=0.15){
    if(!state.sound) return; this.ensure(); if(!this.ctx) return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur);
  },
  correct(){ this.beep(660,0.10); this.beep(880,0.12,'sine',0.07); },
  wrong(){ this.beep(196,0.22,'square',0,0.12); },
  levelup(){ [523,659,784,1047].forEach((f,i)=>this.beep(f,0.15,'triangle',i*0.09,0.18)); },
};
/* Dezente Haptik (funktioniert v.a. auf Android; auf iOS harmloser No-Op) */
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
/* Richtig-/Falsch-Feedback gebündelt */
function fxCorrect(){ Sound.correct(); buzz(15); }
function fxWrong(){ Sound.wrong(); buzz([40,40,40]); }

/* ---------------- Konfetti ---------------- */
function confetti(){
  const cvs=document.createElement('canvas'); cvs.className='confetti-cvs';
  const dpr=window.devicePixelRatio||1, W=window.innerWidth, H=window.innerHeight;
  cvs.width=W*dpr; cvs.height=H*dpr; cvs.style.width=W+'px'; cvs.style.height=H+'px';
  document.body.appendChild(cvs);
  const ctx=cvs.getContext('2d'); ctx.scale(dpr,dpr);
  const colors=['#6c8cff','#8a6cff','#38d39f','#ffd166','#ff6b7a'];
  const parts=[];
  for(let i=0;i<130;i++) parts.push({
    x:W/2+(Math.random()-0.5)*100, y:H*0.32,
    vx:(Math.random()-0.5)*9, vy:Math.random()*-10-3, g:0.30,
    r:Math.random()*6+3, c:colors[i%colors.length], rot:Math.random()*6, vr:(Math.random()-0.5)*0.4
  });
  const t0=performance.now();
  (function frame(now){
    const el=now-t0; ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,1-el/1600); ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore();
    });
    if(el<1600) requestAnimationFrame(frame); else cvs.remove();
  })(t0);
}

/* Level-Info fürs Ergebnis (nur im 'grow'-Modus) */
function levelInfo(mod, from){ return state.mode==='grow' ? {from, to: state.level[mod]||from} : null; }

/* ---------------- Module-Definitionen ---------------- */
const MODULES = {
  math:  {icon:'math',   name:'Kopfrechnen',   desc:'Rechnen auf Zeit, wird adaptiv schwerer'},
  seq:   {icon:'seq',    name:'Zahlenreihen',  desc:'Erkenne das Muster und setze fort'},
  memory:{icon:'memory', name:'Zahlen merken', desc:'Merke dir immer längere Ziffernfolgen'},
  logic: {icon:'logic',  name:'Logik-Schlüsse',desc:'Wahr oder falsch? Logisch schließen'},
  matrix:{icon:'matrix', name:'Muster-Matrix', desc:'Erkenne die Regel im 3×3-Raster'},
  nback: {icon:'nback',  name:'N-Back',        desc:'Arbeitsgedächtnis: Treffer erkennen'},
};

/* ---------------- Aufgaben-Generatoren (von Modulen & Flow genutzt) ---------------- */
const NAMES=['Anna','Ben','Carla','David','Emma','Finn','Greta','Jonas'];
const RELS=[{m:'älter',l:'jünger'},{m:'größer',l:'kleiner'},{m:'schneller',l:'langsamer'},
            {m:'stärker',l:'schwächer'},{m:'teurer',l:'billiger'}];
const SHAPES=['●','▲','■','◆','★'];

function genMath(lv){
  const ops = lv<2 ? ['+','-'] : lv<4 ? ['+','-','×'] : ['+','-','×','÷'];
  const op = ops[Math.floor(Math.random()*ops.length)];
  const max = 5 + lv*4;
  let a=rnd(2,max), b=rnd(2,max), q, ans;
  if(op==='+'){ ans=a+b; q=`${a} + ${b}`; }
  else if(op==='-'){ if(b>a)[a,b]=[b,a]; ans=a-b; q=`${a} − ${b}`; }
  else if(op==='×'){ a=rnd(2,3+lv); b=rnd(2,3+lv); ans=a*b; q=`${a} × ${b}`; }
  else { ans=rnd(2,3+lv); b=rnd(2,3+lv); a=ans*b; q=`${a} ÷ ${b}`; }
  return {q, ans};
}
function genSeq(level){
  const type = Math.floor(Math.random()* (level<2?2: level<4?3:4));
  let arr=[], next, start=rnd(1,9);
  if(type===0){ const d=rnd(2,3+level); arr=[start]; for(let i=0;i<4;i++)arr.push(arr[i]+d); next=arr[4]+d; }
  else if(type===1){ const r=2; arr=[start]; for(let i=0;i<4;i++)arr.push(arr[i]*r); next=arr[4]*r; }
  else if(type===2){ arr=[start]; let d=rnd(2,4); for(let i=0;i<4;i++){arr.push(arr[i]+d); d++;} next=arr[4]+d; }
  else { arr=[1,1]; for(let i=0;i<3;i++)arr.push(arr[arr.length-1]+arr[arr.length-2]); next=arr[4]+arr[3]; }
  return {arr:arr.slice(0,5), next};
}
function genLogic(L){
  const people = L<=2 ? 3 : L<=5 ? 4 : 5;
  const n=shuffle(NAMES).slice(0,people);
  const rel=pick(RELS);
  const prem=[]; for(let k=0;k<people-1;k++) prem.push(`${n[k]} ist ${rel.m} als ${n[k+1]}.`);
  let i=rnd(0,people-1), j=rnd(0,people-1); while(j===i) j=rnd(0,people-1);
  const useMore=Math.random()<0.5;
  const truth=(useMore===(i<j));
  const concl=`${n[i]} ist ${useMore?rel.m:rel.l} als ${n[j]}.`;
  return {prem,concl,truth};
}
function genMatrix(L){
  const stepMax = L>=4 ? 2 : 1;
  const shape=pick(SHAPES);
  const a=rnd(1,2), rs=rnd(1,stepMax), cs=rnd(1,stepMax);
  const grid=[]; for(let r=0;r<3;r++){ const row=[]; for(let c=0;c<3;c++) row.push(a+r*rs+c*cs); grid.push(row); }
  const answer=grid[2][2];
  const opts=new Set([answer]);
  for(const o of shuffle([-3,-2,-1,1,2,3])){ const d=answer+o; if(d>=1) opts.add(d); if(opts.size>=4) break; }
  let g=1; while(opts.size<4){ opts.add(answer+g); g++; }
  return {shape, grid, answer, opts:shuffle([...opts])};
}

/* ---------------- Spieler-XP & Level ---------------- */
function playerLevel(xp){
  let lvl=1, need=120, acc=0;
  while(xp >= acc+need){ acc+=need; lvl++; need=Math.round(need*1.3); }
  return {level:lvl, into:xp-acc, need, floor:acc};
}
function gainXP(amount){
  const before = playerLevel(state.xp||0).level;
  state.xp = (state.xp||0) + amount;
  const after = playerLevel(state.xp).level;
  persist();
  return { gained:amount, leveledUp:after>before, level:after };
}

SCREENS.math = function(){
  const TOTAL = 10;
  const L0=startLevel('math');
  let idx=0, correct=0, level=L0, startAll=Date.now();
  sessionShell('math');

  let current, answered=false;
  function render(){
    setHud(`${idx+1}/${TOTAL} · Level ${level}`);
    current = genMath(level); answered=false;
    const opts = distractors(current.ans);
    document.getElementById('body').innerHTML = `
      <div class="prompt">${current.q}</div>
      <div class="answers">
        ${opts.map(o=>`<button class="ans" data-v="${o}">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="bar"><i style="width:${idx/TOTAL*100}%"></i></div>
    `;
    document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>pick(b));
  }
  function pick(btn){
    if(answered) return; answered=true;
    const v = +btn.dataset.v;
    if(v===current.ans){
      btn.classList.add('correct'); correct++; level++; fxCorrect();
      document.getElementById('fb').textContent='✔ Richtig';
    }else{
      btn.classList.add('wrong'); fxWrong();
      document.querySelectorAll('.ans').forEach(b=>{ if(+b.dataset.v===current.ans) b.classList.add('correct'); });
      level = Math.max(1, level-1);
      document.getElementById('fb').textContent='✗ Falsch: '+current.ans;
    }
    idx++;
    setTimeout(()=>{ idx<TOTAL ? render() : finish(); }, 650);
  }
  function finish(){
    const secs = Math.round((Date.now()-startAll)/1000);
    const score = correct*10 + Math.max(0, level*5) - secs;
    const sc = Math.max(0, score);
    saveLevel('math', level);
    registerSession('math', sc);
    resultScreen('🧮 Kopfrechnen', correct, TOTAL, sc, secs, 'math', '', levelInfo('math', L0));
  }
  render();
};

SCREENS.memory = function(){

  sessionShell('memory');

    body.innerHTML = `<p class="muted center">Merke dir die Zahl…</p><div class="big-num center" id="show">${digits}</div>`;

    setTimeout(()=>askInput(digits), showMs);
  }

    let entered='';
    body.innerHTML = `
      <p class="muted center">Gib die Zahl ein</p>
      <div class="display" id="disp">&nbsp;</div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}

      </div>
      <div class="feedback" id="fb"></div>`;
    const disp=document.getElementById('disp');
    document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==='del') entered=entered.slice(0,-1);
      else if(k==='ok'){ check(entered,digits); return; }
      else if(entered.length<level) entered+=k;
      disp.textContent = entered || ' ';
    });

  function check(entered, digits){
    if(entered===digits){
      best=Math.max(best,level); level++; fxCorrect();
      document.getElementById('fb').textContent='✔ Richtig!';
      setTimeout(newRound, 700);
    }else{
      lives--; fxWrong();
      document.getElementById('fb').textContent='✗ Falsch – war '+digits;
      if(lives<=0){
        const sc=best*20 + (round-1)*3;
        saveLevel('memory', Math.max(D0, best-2));   // Level wächst mit erreichter Länge
        registerSession('memory', sc);
        setTimeout(()=>resultScreen('🧠 Zahlen merken', best, best, sc, 0, 'memory', `Beste Länge: ${best} Ziffern`, levelInfo('memory', D0)), 900);
      }else setTimeout(newRound, 900);
    }
  }
  newRound();
};

/* ---------------- Modul 6: N-Back ---------------- */
SCREENS.nback = function(){
  const L=startLevel('nback');
  const N   = L<=2 ? 1 : L<=6 ? 2 : 3;            // Level steuert die Gedächtnistiefe
  const ISI = Math.max(1600, 2800 - L*110);       // höheres Level = schnelleres Tempo
  const LEN = 14 + Math.min(10, L);               // höheres Level = mehr Durchgänge
  const pool=['C','H','K','L','Q','R','S','T'];
  sessionShell('nback');
  document.getElementById('body').innerHTML=`
    <div class="card">
      <p style="font-size:16px; line-height:1.5; margin:0 0 8px;">Es erscheinen nacheinander Buchstaben. Tippe <b>„Treffer"</b>, wenn der aktuelle Buchstabe <b>derselbe ist wie ${N} ${N===1?'Schritt':'Schritte'} vorher</b> (${N}-Back).</p>
      <p class="muted" style="font-size:14px; margin:0;">Vergleiche jeden Buchstaben mit dem, der ${N} ${N===1?'Position':'Positionen'} vorher kam.</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="startnb">Los geht's (${N}-Back)</button>`;
  document.getElementById('startnb').onclick=run;

  function run(){
    const seq=[];
    for(let k=0;k<LEN;k++){
      if(k>=N && Math.random()<0.33) seq.push(seq[k-N]);   // erzwungener Treffer
      else seq.push(pick(pool));
    }
    const targets=seq.filter((c,k)=>k>=N && c===seq[k-N]).length || 1;
    const body=document.getElementById('body');
    const GAP = 380;                               // Leerpause: trennt zwei gleiche Buchstaben sichtbar
    const SHOW = Math.max(750, ISI - GAP);
    let i=0, pressed=false, hits=0, misses=0, fa=0;

    body.innerHTML = `<div class="nb-letter" id="nbl"></div><button class="nb-hit" id="hit">Treffer</button>`;
    const letterEl = document.getElementById('nbl');
    const hitBtn = document.getElementById('hit');
    hitBtn.onclick = function(){
      if(!pressed){ pressed=true; this.classList.add('flash'); Sound.beep(520,0.06,'sine',0,0.1); buzz(10); }
    };

    function step(){
      setHud(`${i+1}/${LEN} · ${N}-Back`);
      pressed=false; hitBtn.classList.remove('flash');
      letterEl.textContent = seq[i];
      letterEl.classList.remove('pop'); void letterEl.offsetWidth; letterEl.classList.add('pop');
      setTimeout(()=>{
        letterEl.textContent='';                   // Buchstabe aus -> Pause
        setTimeout(()=>{                           // Antwortfenster endet mit der Pause
          if(i>=N){ const t=(seq[i]===seq[i-N]); if(t){ pressed?hits++:misses++; } else if(pressed){ fa++; } }
          i++; if(i>=LEN) finish(); else step();
        }, GAP);
      }, SHOW);
    }
    function finish(){
      const sc=Math.max(0, hits*18 - fa*10 - misses*4);
      growByAccuracy('nback', L, hits, targets);
      registerSession('nback', sc);
      resultScreen('🎯 N-Back', hits, targets, sc, 0, 'nback', `${N}-Back · Fehlalarme: ${fa} · Verpasst: ${misses}`, levelInfo('nback', L));
    }
    step();
  }
};

      const cc=document.getElementById('fcombo');
      cc.textContent = combo>=2 ? `${combo}× Combo` : '';
      cc.className = 'fcombo' + (combo>=2?' show':'');
    }
    function lvlForCombo(){ return Math.max(1, Math.min(10, 1 + Math.floor(combo/3))); }
    function next(){
      answered=false;
      const L=lvlForCombo();
      curType = pick(['math','seq','logic','matrix']);
      if(curType==='math'){ cur=genMath(L); renderChoice(cur.q, cur.ans, distractors(cur.ans)); }
      else if(curType==='seq'){ cur=genSeq(L); renderChoice(cur.arr.join('  ·  ')+'  ·  ?', cur.next, distractors(cur.next), true); }
      else if(curType==='logic'){ cur=genLogic(L); renderLogic(cur); }
      else { cur=genMatrix(L); renderMatrix(cur); }
    }
    function renderChoice(promptText, ans, opts, small){
      body().innerHTML = `
        <div class="prompt ${small?'small':''}">${promptText}</div>
        <div class="answers">${opts.map(o=>`<button class="ans" data-v="${o}">${o}</button>`).join('')}</div>
        <div class="feedback" id="fb"></div>`;
      document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>judge(+b.dataset.v===ans, b));
    }
    function renderLogic(c){
      body().innerHTML = `
        <p class="muted">Angenommen:</p>
        ${c.prem.map(p=>`<div class="premise">${p}</div>`).join('')}
        <div class="concl">${c.concl}</div>
        <div class="tf">
          <button class="t" data-v="1">WAHR</button>
          <button class="f" data-v="0">FALSCH</button>
        </div>
        <div class="feedback" id="fb"></div>`;
      document.querySelectorAll('.tf button').forEach(b=>b.onclick=()=>judge((b.dataset.v==='1')===c.truth, b));
    }
    function renderMatrix(c){
      let cells='';
      for(let r=0;r<3;r++)for(let col=0;col<3;col++){
        cells += (r===2&&col===2) ? `<div class="mcell q">?</div>` : `<div class="mcell">${c.shape.repeat(c.grid[r][col])}</div>`;
      }
      body().innerHTML = `
        <div class="matrix">${cells}</div>
        <div class="mopts">${c.opts.map(o=>`<div class="mopt" data-v="${o}">${c.shape.repeat(o)}</div>`).join('')}</div>
        <div class="feedback" id="fb"></div>`;
      document.querySelectorAll('.mopt').forEach(b=>b.onclick=()=>judge(+b.dataset.v===c.answer, b));
    }
    function markCorrect(){
      if(curType==='math'||curType==='seq') document.querySelectorAll('.ans').forEach(b=>{ if(+b.dataset.v===cur.ans || +b.dataset.v===cur.next) b.classList.add('correct'); });
      else if(curType==='matrix') document.querySelectorAll('.mopt').forEach(b=>{ if(+b.dataset.v===cur.answer) b.classList.add('correct'); });
    }
    function judge(correct, btn){
      if(answered) return; answered=true; count++;
      if(correct){
        combo++; bestCombo=Math.max(bestCombo,combo);
        const pts = 10 + combo*2;
        score += pts; fxCorrect(); floatXP('+'+pts, btn);
        if(btn) btn.classList.add('correct');
        if(combo%5===0){ Sound.levelup(); toast(`${combo}× Combo!`); }
        updateTop();
        setTimeout(next, 340);
      }else{
        combo=0; lives--; fxWrong();
        if(btn) btn.classList.add('wrong');
        markCorrect(); updateTop();
        setTimeout(()=> lives<=0 ? end() : next(), 780);
      }
    }
    function end(){
      const isBest = score>(state.best.flow||0);
      registerSession('flow', score);
      const xpRes = gainXP(Math.round(score*0.8));
      app.innerHTML = `
        <div class="center" style="padding-top:26px;">
          <div class="ricon">${svgIcon('flow',48)}</div>
          <h2>${isBest?'Neuer Bestlauf!':'Lauf beendet'}</h2>
          <div class="card" style="margin:16px 0;">
            <div class="big-num">${score}</div>
            <div class="muted">Punkte</div>
            <div class="xpgain">+${xpRes.gained} XP</div>
            <div class="spacer"></div>
            <div class="row">
              <div class="stat"><div class="big">${count}</div><div class="lbl">Fragen</div></div>
              <div class="stat"><div class="big">${bestCombo}×</div><div class="lbl">Beste Combo</div></div>
              <div class="stat"><div class="big">${state.best.flow||score}</div><div class="lbl">Bestlauf</div></div>
            </div>
          </div>
          <button class="btn" onclick="go('flow')">Nochmal</button>
          <div class="spacer"></div>
          <button class="btn ghost" onclick="go('home')">Zur Startseite</button>
        </div>`;
      if(isBest || xpRes.leveledUp) confetti();
      if(xpRes.leveledUp){ Sound.levelup(); toast('Level '+xpRes.level+' erreicht!'); }
    }
  }
};

/* ---------------- Ergebnis-Screen ---------------- */
function resultScreen(title, correct, total, score, secs, module, extra, lvl){
  const isNewBest = state.best[module]===score && score>0;
  const xpRes = gainXP(Math.round(score*0.6));
  const up = !!(lvl && lvl.to>lvl.from), down = !!(lvl && lvl.to<lvl.from);
  let lvlHtml='';
  if(lvl){
    lvlHtml = up
      ? `<div class="lvlchange up">Level ${lvl.from} → ${lvl.to} ⬆</div>`
      : down
        ? `<div class="lvlchange down">Level ${lvl.from} → ${lvl.to} ⬇</div>`
        : `<div class="lvlchange same">Level ${lvl.to} gehalten</div>`;
  }
  const heading = up ? 'Level aufgestiegen!' : isNewBest ? 'Neuer Bestwert!' : 'Session beendet';
  app.innerHTML = `
    <div class="center" style="padding-top:20px;">
      <div class="ricon">${svgIcon(MODULES[module].icon,48)}</div>
      <h2>${heading}</h2>
      <div class="card" style="margin:16px 0;">
        <div class="big-num">${score}</div>
        <div class="muted">Punkte</div>
        <div class="xpgain">+${xpRes.gained} XP</div>
        ${lvlHtml}
        <div class="spacer"></div>
        <div class="row">
          <div class="stat"><div class="big">${correct}/${total}</div><div class="lbl">${module==='nback'?'Treffer':module==='memory'?'Länge':'Richtig'}</div></div>
          ${secs?`<div class="stat"><div class="big">${secs}s</div><div class="lbl">Zeit</div></div>`:''}
          <div class="stat"><div class="big">${state.best[module]||score}</div><div class="lbl">Bestwert</div></div>
        </div>
        ${extra?`<div class="muted" style="margin-top:10px;">${extra}</div>`:''}
      </div>
      <button class="btn" onclick="go('${module}')">Nochmal</button>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="go('home')">Zur Startseite</button>
    </div>`;
  if(up || xpRes.leveledUp){ Sound.levelup(); confetti(); }
  else if(isNewBest){ confetti(); }
  if(xpRes.leveledUp) toast('Level '+xpRes.level+' erreicht!');
  else if(state.todayCount===state.goal) toast('Tagesziel erreicht');
}

/* ---------------- Statistik ---------------- */
SCREENS.stats = function(){
  const last = state.history.slice(-14);
  const maxS = Math.max(1, ...last.map(h=>h.score));
  const byModule = {};
  state.history.forEach(h=>{ byModule[h.module]=(byModule[h.module]||{n:0,sum:0}); byModule[h.module].n++; byModule[h.module].sum+=h.score; });
  app.innerHTML = `
    <h2 class="shead" style="margin-top:6px;"><span class="hicon">${svgIcon('stats',22)}</span>Statistik</h2>
    ${xpBar()}
    <div class="spacer"></div>
    <div class="card">
      <div class="muted" style="font-size:13px;">Punkte der letzten ${last.length} Sessions</div>
      <div class="chartrow">
        ${last.length? last.map(h=>`<div style="height:${Math.round(h.score/maxS*100)}%" title="${h.score}"></div>`).join('')
          : '<div class="muted" style="align-self:center;">Noch keine Daten – leg los!</div>'}
      </div>
    </div>
    <div class="spacer"></div>
    ${Object.entries(byModule).map(([k,v])=>{
      const name = MODULES[k]?MODULES[k].name:(k==='flow'?'Flow':k);
      const ic = MODULES[k]?MODULES[k].icon:(k==='flow'?'flow':'stats');
      return `<div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:10px;"><span class="hicon">${svgIcon(ic,20)}</span>
          <div><div style="font-weight:700;">${name}</div>
          <div class="muted" style="font-size:13px;">${v.n} Sessions · ⌀ ${Math.round(v.sum/v.n)} Pkt</div></div></div>
        <div style="font-size:22px; font-weight:800; color:var(--acc)">${state.best[k]||0}</div>
      </div>`;}).join('') || '<p class="muted">Noch keine Trainingsdaten vorhanden.</p>'}
    <div class="spacer"></div>
    <button class="btn ghost" onclick="if(confirm('Wirklich alle Daten löschen?')){localStorage.removeItem('denksport'); location.reload();}">Fortschritt zurücksetzen</button>
    ${navBar('stats')}
  `;
};

/* ---------------- Helfer ---------------- */
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function distractors(correct){
  const set=new Set([correct]);
  while(set.size<4){
    let d = correct + rnd(-Math.max(3,Math.abs(correct)*0.3|0), Math.max(3,Math.abs(correct)*0.3|0));
    if(d!==correct && d>=0) set.add(d);
    if(set.size<4 && d<0) set.add(Math.abs(correct)+set.size);
  }
  return [...set].sort(()=>Math.random()-0.5);
}
